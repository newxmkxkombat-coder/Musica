<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Música</title>
  <!-- Para poder instalarla como app en el móvil, con su logo -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="iconos/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <meta name="theme-color" content="#0b0b0c">
  <!-- Tipografía "Figtree": redondita y moderna, parecida a la de Spotify -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Le decimos al navegador que vaya conectando con YouTube desde ya (carga más rápido) -->
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <style>
    /* ===== COLORES Y MEDIDAS (variables): cámbialos aquí y cambia toda la app ===== */
    :root {
      --fondo: #0b0b0c;          /* negro casi puro, el fondo de todo */
      --panel: #151517;          /* tarjetas y paneles */
      --tarjeta: #242427;        /* cosas un poco más claras */
      --borde: #ffffff14;        /* bordes finitos y transparentes */
      --texto: #f5f5f7;
      --gris: #a7a7ad;
      --gris2: #6b6b73;
      --verde: #1ed760;
      --radio: 10px;
      --fuente: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--fondo);
      color: var(--texto);
      font-family: var(--fuente);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-columns: 250px 1fr;
      grid-template-rows: 1fr auto;
      grid-template-areas: "menu contenido" "mini mini";
      gap: 8px;
      padding: 8px;
      overflow: hidden;
    }
    button { font-family: inherit; }
    img { display: block; }
    [hidden] { display: none !important; }

    /* ----- Iconos (dibujos SVG) ----- */
    .ic { width: 20px; height: 20px; fill: currentColor; flex: none; }

    /* ----- Botones: sin el marco azul y con animación al pulsar ----- */
    button, a, .cancion, .carpeta, .sug, .tile, .tarjetaRec, #mini { -webkit-tap-highlight-color: transparent; }
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }   /* solo con teclado */
    button { transition: transform .12s ease, background-color .15s ease, color .15s ease; }
    button:active { transform: scale(.9); }
    .cancion, .carpeta, .tile, .tarjetaRec { transition: transform .12s ease, background-color .15s ease; }
    .cancion:active, .carpeta:active, .tile:active, .tarjetaRec:active { transform: scale(.97); }
    @keyframes latido { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .latido { animation: latido .28s ease; }
    @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }

    .boton {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--verde); color: #000; border: none; border-radius: 999px;
      padding: 11px 20px; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .boton.gris { background: transparent; color: var(--texto); border: 1px solid #ffffff2e; }
    .iconoBoton {
      display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
      background: none; border: none; color: var(--gris); cursor: pointer;
    }
    .iconoBoton:hover { color: var(--texto); }

    /* ===================== MENÚ (izquierda en ordenador, abajo en móvil) ===================== */
    nav {
      grid-area: menu; background: var(--panel); border-radius: var(--radio);
      padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 0;
    }
    .marca { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; margin: 0 8px 20px; }
    .marca span { color: var(--verde); }
    .logo { width: 34px; height: 34px; }
    .menu {
      display: flex; align-items: center; gap: 14px;
      background: none; border: none; color: var(--gris); text-align: left; padding: 11px 12px;
      border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .menu:hover, .menu.activo { color: var(--texto); }
    .menu .ic { width: 24px; height: 24px; }
    .menu .lleno { display: none; }                 /* icono relleno cuando está activo */
    .menu.activo .lleno { display: block; }
    .menu.activo .vacio { display: none; }
    .linkClave { margin-top: auto; background: none; border: none; color: var(--gris); font-size: 12px; cursor: pointer; padding: 8px 12px; text-align: left; }

    /* ===================== CONTENIDO ===================== */
    main {
      grid-area: contenido; overflow-y: auto; padding: 20px 24px 32px; border-radius: var(--radio);
      background: linear-gradient(180deg, #1d3b29 0%, var(--panel) 280px);
      min-width: 0;
    }
    h2 { font-size: 24px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 16px; text-wrap: balance; }
    h2:empty { display: none; }
    .aviso { color: var(--gris); padding: 20px 0; line-height: 1.6; }
    .version { font-size: 12px; text-align: center; color: var(--gris2); }

    /* ----- Inicio ----- */
    .saludo { font-size: 24px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 16px; }
    .accesos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px; margin-bottom: 28px; }
    @media (max-width: 700px) { .accesos { grid-template-columns: 1fr 1fr; } }
    .tile {
      display: flex; align-items: center; gap: 10px; height: 56px; padding-right: 8px; border-radius: 6px; overflow: hidden;
      background: #ffffff14; cursor: pointer; font-weight: 700; font-size: 13px; min-width: 0;
    }
    .tile:hover { background: #ffffff24; }
    .tile .tapa { width: 56px; height: 56px; aspect-ratio: auto; margin: 0; border-radius: 0; box-shadow: 4px 0 12px #0006; flex: none; }
    .tile .tapa .ic { width: 22px; height: 22px; }
    .tile span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; }
    .seccion { margin-bottom: 28px; }
    .seccion h3 { font-size: 21px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 12px; }
    .fila { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
    .fila::-webkit-scrollbar { display: none; }
    .tarjetaRec { flex: 0 0 140px; scroll-snap-align: start; cursor: pointer; min-width: 0; }
    .tarjetaRec img { width: 140px; height: 140px; object-fit: cover; border-radius: 6px; background: var(--tarjeta); box-shadow: 0 8px 20px #0007; margin-bottom: 8px; }
    .tarjetaRec .titulo { font-size: 14px; }
    .esqueleto { background: linear-gradient(90deg, #ffffff0d, #ffffff1a, #ffffff0d); background-size: 200% 100%; animation: brillo 1.2s infinite; }
    @keyframes brillo { to { background-position: -200% 0; } }

    /* ----- Buscador ----- */
    .buscador { margin-bottom: 24px; display: flex; align-items: center; gap: 8px; }
    .caja { position: relative; flex: 1; min-width: 0; max-width: 520px; }
    .caja > .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #000; pointer-events: none; }
    .buscador input {
      width: 100%; padding: 14px 44px 14px 46px; border-radius: 8px; border: none;
      background: #fff; color: #000; font-size: 15px; font-weight: 600; font-family: inherit;
    }
    .buscador input::placeholder { color: #555; font-weight: 500; }
    .buscador input:focus { outline: none; }
    .buscador input::-webkit-search-cancel-button { display: none; }
    #volverBusqueda, #borrarBusqueda { display: none; }
    #borrarBusqueda { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; }

    /* ----- Modo "escribiendo" (como Spotify): barra oscura, flecha atrás y
       las sugerencias ocupan la pantalla, sin ventanita ----- */
    main.escribiendo { background: #121212; }   /* fondo liso mientras escribes */
    main.escribiendo .buscador { margin: -4px 0 8px; }
    main.escribiendo #volverBusqueda { display: grid; color: var(--texto); flex: none; }
    main.escribiendo #volverBusqueda .ic { width: 26px; height: 26px; }
    main.escribiendo .caja > .ic { display: none; }
    main.escribiendo .buscador input { background: #2a2a2a; color: var(--texto); border-radius: 999px; padding: 12px 44px 12px 18px; font-weight: 500; font-size: 17px; }
    main.escribiendo .buscador input::placeholder { color: var(--gris); }
    main.escribiendo #borrarBusqueda { display: grid; }
    #borrarBusqueda span { width: 22px; height: 22px; border-radius: 50%; background: #b3b3b3; color: #2a2a2a; display: grid; place-items: center; }
    #borrarBusqueda .ic { width: 14px; height: 14px; }
    main.escribiendo #tituloLista, main.escribiendo #lista { display: none; }
    .sugerencias { display: none; }
    main.escribiendo .sugerencias { display: block; margin: 0 -8px; }
    .sug { display: flex; gap: 14px; align-items: center; padding: 10px 8px; border-radius: 6px; cursor: pointer; min-width: 0; }
    .sug:active { background: #ffffff12; }
    .sug img { width: 56px; height: 56px; border-radius: 4px; flex: none; background: var(--tarjeta); object-fit: cover; }
    .sug .lupa { width: 28px; display: grid; place-items: center; color: var(--texto); flex: none; }
    .sug .lupa .ic { width: 24px; height: 24px; }
    .sug > div { min-width: 0; flex: 1; }
    .sug .frase { font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sug .frase .escrito { color: var(--gris); }      /* lo que ya escribiste, en gris */
    .sug .titulo { font-size: 17px; font-weight: 500; }
    .sug .canal { font-size: 14px; }
    .sug .flecha { color: var(--gris); flex: none; }
    .sug .flecha .ic { width: 22px; height: 22px; }
    .frases { margin-bottom: 14px; }

    /* ----- Lista de canciones ----- */
    .cancion {
      display: grid; grid-template-columns: 24px 48px 1fr auto; gap: 12px;
      align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer;
    }
    .cancion:hover { background: #ffffff0d; }
    .cancion img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; background: var(--tarjeta); }
    .cancion .num { color: var(--gris); text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; }
    .titulo { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .canal { color: var(--gris); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cancion.sonando .titulo, .cancion.sonando .num { color: var(--verde); }
    .corazon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: none; border: none; cursor: pointer; color: var(--gris); flex: none; }
    .corazon:hover { color: var(--texto); }
    .corazon.lleno { color: var(--verde); }
    .corazon .ic { width: 22px; height: 22px; }
    .ecualizador { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
    .ecualizador i { width: 3px; background: var(--verde); border-radius: 1px; animation: barra 0.9s ease-in-out infinite; }
    .ecualizador i:nth-child(2) { animation-delay: -.3s; } .ecualizador i:nth-child(3) { animation-delay: -.6s; }
    @keyframes barra { 0%, 100% { height: 4px; } 50% { height: 14px; } }

    /* ----- Biblioteca: carpetas ----- */
    .carpetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .carpeta { border-radius: var(--radio); padding: 10px; cursor: pointer; min-width: 0; }
    .carpeta:hover { background: #ffffff0d; }
    .tapa {
      width: 100%; aspect-ratio: 1; border-radius: 6px; margin-bottom: 10px; object-fit: cover;
      background: linear-gradient(135deg, #5b3df5, #9fe0c4); display: grid; place-items: center; color: #fff;
      box-shadow: 0 8px 24px #0008;
    }
    .tapa.nota { background: linear-gradient(135deg, #2ee86f, #0f5f2c); }
    .tapa .ic { width: 44px; height: 44px; }
    .nuevaCarpeta { display: flex; gap: 8px; margin-bottom: 20px; max-width: 520px; }
    .nuevaCarpeta input, .bienvenida input {
      flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px; border: 1px solid var(--borde);
      background: #ffffff12; color: var(--texto); font-family: inherit; font-size: 14px;
    }
    .nuevaCarpeta input:focus, .bienvenida input:focus { outline: none; border-color: #ffffffaa; }
    .cabCarpeta { display: flex; gap: 20px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; }
    .cabCarpeta .tapa { width: 150px; margin: 0; flex: none; }
    .cabCarpeta small { color: var(--gris); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; }
    .cabCarpeta h3 { font-size: 30px; font-weight: 800; letter-spacing: -.8px; line-height: 1.1; margin: 4px 0 6px; text-wrap: balance; }
    .acciones { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .botonPlayGrande {
      display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--verde); color: #000; box-shadow: 0 8px 24px #1ed76044;
    }
    .botonPlayGrande .ic { width: 26px; height: 26px; }
    .acciones .iconoBoton .ic { width: 24px; height: 24px; }
    .acciones .borrar.seguro { color: #ff5c5c; width: auto; padding: 0 12px; border-radius: 999px; font-weight: 700; gap: 6px; display: inline-flex; }

    /* ----- Hoja "Guardar en carpeta" (sale desde abajo) ----- */
    .fondoHoja { position: fixed; inset: 0; background: #000b; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
    @keyframes subir { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .hoja {
      background: #1d1d20; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
      padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 80vh; overflow-y: auto; animation: subir .22s ease;
    }
    .hoja .agarre { width: 40px; height: 4px; border-radius: 2px; background: #ffffff33; margin: 0 auto 16px; }
    .hoja h3 { font-size: 18px; font-weight: 800; }
    .hoja .canal { margin-bottom: 14px; }
    .opcionCarpeta {
      display: flex; gap: 12px; align-items: center; width: 100%; padding: 8px; text-align: left;
      background: none; border: none; color: var(--texto); font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 8px;
    }
    .opcionCarpeta:hover { background: #ffffff0f; }
    .opcionCarpeta .mini { width: 44px; height: 44px; border-radius: 4px; flex: none; object-fit: cover;
                           background: linear-gradient(135deg, #5b3df5, #9fe0c4); display: grid; place-items: center; color: #fff; }
    .opcionCarpeta .mini.nota { background: linear-gradient(135deg, #2ee86f, #0f5f2c); }
    .opcionCarpeta .mini .ic { width: 18px; height: 18px; }
    .opcionCarpeta .nombre { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .opcionCarpeta .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--gris2); display: grid; place-items: center; flex: none; }
    .opcionCarpeta .check.si { background: var(--verde); border-color: var(--verde); color: #000; }
    .opcionCarpeta .check .ic { width: 14px; height: 14px; }
    .hoja .nuevaCarpeta { margin: 14px 0 12px; }
    .hoja .boton.gris { width: 100%; justify-content: center; }

    /* Aviso "Ábrela en Brave" y tarjeta de bienvenida */
    .avisoBrave { background: linear-gradient(135deg, #fb542b, #e0337a); color: #fff; border-radius: var(--radio); padding: 14px 16px; margin-bottom: 20px;
                  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; line-height: 1.4; }
    .avisoBrave p { flex: 1 1 220px; }
    .avisoBrave a { background: #fff; color: #000; font-weight: 700; text-decoration: none; padding: 10px 18px; border-radius: 999px; white-space: nowrap; }
    .avisoBrave button { background: none; border: none; color: #fff; text-decoration: underline; cursor: pointer; font-size: 12px; }
    .bienvenida { background: #ffffff0a; border: 1px solid var(--borde); border-radius: var(--radio); padding: 22px; max-width: 540px; line-height: 1.6; }
    .bienvenida h3 { margin-bottom: 8px; font-size: 18px; }
    .bienvenida ol { margin: 8px 0 14px 20px; color: var(--gris); }
    .bienvenida a { color: var(--verde); }
    .bienvenida .fila { display: flex; gap: 8px; overflow: visible; }

    /* Barras deslizantes (progreso y volumen) hechas a mano para que se vean finas */
    input[type=range] { --pct: 0%; flex: 1; height: 16px; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; min-width: 0; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, #fff var(--pct), #ffffff33 var(--pct)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px #0008; }
    input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: #ffffff33; }
    input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: #fff; }
    input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: none; border-radius: 50%; background: #fff; }
    input[type=range]:focus { outline: none; }

    /* ===================== MINI REPRODUCTOR (abajo) ===================== */
    #mini {
      grid-area: mini; position: relative; background: var(--panel); border-radius: var(--radio);
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); align-items: center; gap: 16px; padding: 10px 14px;
    }
    #mini .info { display: flex; gap: 12px; align-items: center; min-width: 0; cursor: pointer; }
    #mini .info img { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--tarjeta); flex: none; }
    #mini .info > div { min-width: 0; }
    .controles { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
    .botones { display: flex; gap: 18px; align-items: center; justify-content: center; }
    .botones .iconoBoton { color: #e4e4e7; }
    .botones .iconoBoton .ic { width: 22px; height: 22px; }
    .btnPlay { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; background: #fff; color: #000; flex: none; }
    .btnPlay .ic { width: 20px; height: 20px; }
    .btnPlay { position: relative; }
    @keyframes girar { to { transform: rotate(360deg); } }
    .btnPlay.cargando::after {   /* anillo verde que gira alrededor del play */
      content: ""; position: absolute; inset: -4px; border-radius: 50%;
      border: 2.5px solid transparent; border-top-color: var(--verde); border-right-color: var(--verde);
      animation: girar .8s linear infinite;
    }
    .progreso { display: flex; gap: 10px; align-items: center; width: 100%; max-width: 560px; font-size: 11px; color: var(--gris); font-variant-numeric: tabular-nums; }
    .progreso span { width: 36px; text-align: center; }
    .derecha { display: flex; justify-content: flex-end; align-items: center; gap: 8px; color: var(--gris); }
    .derecha input { max-width: 110px; }
    .soloMovil { display: none !important; }
    .rayita { display: none; }

    /* ===================== PANTALLA "REPRODUCIENDO" (se abre al tocar el mini) ===================== */
    #pantalla {
      position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, #2b4a36 0%, #121214 70%);
      transform: translateY(100%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); overflow-y: auto;
    }
    /* No la escondemos con display:none: así los reproductores de YouTube siguen funcionando */
    #pantalla.abierta { transform: none; }
    .barraArriba { width: 100%; max-width: 440px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .barraArriba small { display: block; text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: #ffffffb3; }
    .barraArriba b { display: block; text-align: center; font-size: 13px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .barraArriba .iconoBoton { color: var(--texto); }
    .barraArriba .iconoBoton .ic { width: 26px; height: 26px; }
    .grande { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; }
    /* La portada (y el vídeo si lo pides). YouTube pide que su reproductor se vea. */
    #video { position: relative; width: 100%; aspect-ratio: 1; max-height: 52vh; max-width: 52vh; margin: 0 auto;
             border-radius: 8px; overflow: hidden; background: #000; box-shadow: 0 20px 50px #000b; }
    /* Truco de velocidad: YouTube elige la calidad según el TAMAÑO del reproductor.
       En "solo música" lo dejamos pequeñito (escondido detrás de la portada), así
       carga un vídeo de baja calidad: menos datos y suena antes. */
    #video iframe { position: absolute; top: 50%; left: 50%; width: 356px; height: 200px; transform: translate(-50%, -50%); }
    #video.conVideo iframe { width: 178%; height: 100%; }
    #video iframe.dormido { opacity: 0; pointer-events: none; }
    #portada { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    #video.conVideo #portada { display: none; }
    #btnVideo {

      color: var(--texto); font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px;
    }
    #btnVideo .ic { width: 14px; height: 14px; }
    .nombreGrande { display: flex; align-items: center; gap: 12px; }
    .nombreGrande > div { flex: 1; min-width: 0; }
    .nombreGrande .titulo { font-size: 22px; font-weight: 800; }
    .nombreGrande .canal { font-size: 15px; }
    .nombreGrande .corazon .ic { width: 26px; height: 26px; }
    .grande .progreso { max-width: none; flex-wrap: wrap; justify-content: space-between; gap: 4px; }
    .grande .progreso input { flex: 1 0 100%; }
    .grande .progreso span { width: auto; }
    .grande .botones { gap: 36px; }
    .grande .botones .iconoBoton { width: 52px; height: 52px; }
    .grande .botones .iconoBoton .ic { width: 32px; height: 32px; }
    .grande .btnPlay { width: 66px; height: 66px; }
    .grande .btnPlay .ic { width: 30px; height: 30px; }

    /* ===================== MÓVIL ===================== */
    @media (max-width: 700px) {
      body {
        grid-template-columns: 1fr; grid-template-rows: 1fr;
        grid-template-areas: "contenido";
        gap: 0; padding: 0; padding-top: env(safe-area-inset-top, 0px);
        --alturaMenu: calc(62px + env(safe-area-inset-bottom, 0px));
      }
      /* El contenido ocupa TODA la pantalla y el menú y el mini flotan encima.
         Dejamos espacio abajo para que lo último no quede tapado. */
      main { padding: 16px 16px calc(var(--alturaMenu) + 90px); border-radius: 0; }
      /* El menú pasa abajo, con iconos encima del texto, como Spotify */
      nav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: var(--alturaMenu);
        flex-direction: row; justify-content: space-around; padding: 8px 8px calc(6px + env(safe-area-inset-bottom, 0px));
        border-radius: 0; gap: 0;
        /* Como Spotify: arriba transparente y abajo se oscurece poco a poco.
           Así se ve lo de detrás y los iconos blancos se leen bien. */
        background: transparent;   /* la barra en sí no tiene fondo */
      }
      /* La sombra va en una capa aparte, mucho más alta que la barra y que se oscurece
         muy poco a poco (con muchos pasos). Así no se nota ningún borde ni línea. */
      nav::before {
        content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 170px; z-index: -1; pointer-events: none;
        background: linear-gradient(180deg,
          #00000000 0%, #00000008 15%, #00000017 30%, #0000002e 45%,
          #0000004d 58%, #00000073 70%, #0000009e 82%, #000000c7 92%, #000000d9 100%);
      }
      .marca, .linkClave { display: none; }
      .menu { flex-direction: column; gap: 4px; padding: 6px 12px 0; font-size: 12px; font-weight: 500; flex: 1; align-items: center; color: #b3b3b3; }
      .menu.activo { color: #fff; font-weight: 700; }
      .menu .ic { width: 28px; height: 28px; }
      .menu:active { transform: scale(.9); }
      /* Mini reproductor pequeñito, como el de Spotify */
      #mini {
        position: fixed; left: 8px; right: 8px; bottom: calc(var(--alturaMenu) - 4px); z-index: 11;
        grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 8px 8px 10px 8px;
        /* Medio transparente y con desenfoque: deja ver un poco lo de detrás */
        background: #26332bd9; backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
        border-radius: 8px; box-shadow: 0 8px 24px #0006;
      }
      #mini .info { gap: 10px; }
      #mini .info img { width: 40px; height: 40px; border-radius: 4px; }
      #mini .titulo { font-size: 14px; } #mini .canal { font-size: 13px; margin-top: 0; }
      #mini .controles, #mini .derecha > .ic, #mini .derecha input { display: none; }
      #mini .derecha { gap: 2px; }
      .soloMovil { display: grid !important; }
      #mini .btnPlay { background: none; color: var(--texto); width: 40px; height: 40px; }
      #mini .btnPlay .ic { width: 26px; height: 26px; }
      /* La rayita de progreso pegada abajo del mini reproductor */
      .rayita { display: block; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 2px; background: #ffffff33; overflow: hidden; }
      .rayita i { display: block; height: 100%; width: 0; background: #fff; }
      .cancion { grid-template-columns: 22px 44px 1fr auto; gap: 12px; padding: 6px 2px; }
      .cancion img { width: 44px; height: 44px; }
      .cabCarpeta .tapa { width: 120px; }
      .cabCarpeta h3 { font-size: 24px; }
      .buscador { margin-bottom: 18px; }
    }

  <!-- Script oficial de YouTube: nos da el reproductor -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Pequeñas ayudas
    function icono(nombre) { return `<svg class="ic"><use href="#i-${nombre}"/></svg>`; }
    const $ = (id) => document.getElementById(id);
    const todos = (sel) => document.querySelectorAll(sel);

    // =====================================================================
    // 1) DATOS: lo que la app "recuerda"
    // =====================================================================
    // localStorage = una pequeña libreta del navegador que no se borra al cerrar.
    function leer(nombre, porDefecto) {
      try { return JSON.parse(localStorage.getItem(nombre)) ?? porDefecto; }
      catch { return porDefecto; }
    }
    function guardar(nombre, valor) {
      try { localStorage.setItem(nombre, JSON.stringify(valor)); } catch {}
    }

    // Carpetas: cada una tiene un nombre y su lista de canciones.
    // La primera vez, tus favoritos de antes pasan a la carpeta "Favoritos".
    let carpetas = leer("carpetas", null) ||
      [{ id: "fav", nombre: "Favoritos", canciones: leer("favoritos", []) }];
    let historial = leer("historial", []);  // lo último que escuchaste (para el Inicio)
    let cola = [];                           // la lista que está sonando
    let nombreCola = "";                     // de dónde viene ("Favoritos", "Búsqueda"…)
    let posicion = -1;                       // cuál de la cola está sonando
    let reproductor = null;                  // el reproductor que está sonando ahora
    let jugadores = [];                      // los tres reproductores de YouTube
    let cargado = [null, null, null];        // qué canción tiene cargada cada uno
    let activo = 0;                          // cuál de los tres suena (0, 1 o 2)
    let volumen = 80;

    // =====================================================================
    // 2) LA CLAVE DE YOUTUBE (para poder buscar)
    // =====================================================================
    function mostrarBienvenida() {
      cambiarVista("buscar", false);
      $("tituloLista").textContent = "¡Hola! 👋";
      $("lista").innerHTML = `
        <div class="bienvenida">
          <h3>Un paso antes de buscar</h3>
          Para buscar canciones necesitas una clave gratis de YouTube:
          <ol>
            <li>Abre <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank">esta página</a> y pulsa <b>Habilitar</b>.</li>
            <li>Ve a <b>Credenciales → Crear credenciales → Clave de API</b>.</li>
            <li>Cópiala y pégala aquí abajo.</li>
          </ol>
          <div class="fila">
            <input id="campoClave" placeholder="Pega tu clave aquí">
            <button class="boton" id="guardarClave">Guardar</button>
          </div>
        </div>`;
      $("campoClave").value = leer("claveYT", "");
      $("guardarClave").onclick = () => {
        guardar("claveYT", $("campoClave").value.trim());
        $("btnClave").hidden = true;
        cambiarVista("inicio");
      };
    }
    $("btnClave").onclick = mostrarBienvenida;
    $("btnClave").hidden = !!leer("claveYT", "");

    // =====================================================================
    // 3) BUSCAR canciones en YouTube
    // =====================================================================
    // Saca el ID de un enlace como https://youtu.be/abc o ...watch?v=abc
    function idDeEnlace(texto) {
      const m = texto.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
      return m ? m[1] : null;
    }

    // Pregunta a YouTube y devuelve una lista de canciones (gasta 1 de tus ~100 búsquedas diarias)
    // Guardamos las búsquedas 1 día: si repites una, sale al instante y no gasta tu clave
    let memoriaBusquedas = leer("memoriaBusquedas", {});
    async function buscarEnYouTube(texto) {
      const llave = texto.toLowerCase().trim();
      const guardada = memoriaBusquedas[llave];
      if (guardada && Date.now() - guardada.cuando < 24 * 3600 * 1000) return guardada.lista;
      const clave = leer("claveYT", "");
      if (!clave) throw new Error("sin clave");
      const url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video" +
                  "&videoCategoryId=10&maxResults=20&q=" + encodeURIComponent(texto) + "&key=" + clave;
      const datos = await (await fetch(url)).json();
      if (datos.error) throw new Error(datos.error.message);
      const lista = datos.items.map(v => ({
        id: v.id.videoId,
        titulo: decodificar(v.snippet.title),
        canal: decodificar(v.snippet.channelTitle),
        img: v.snippet.thumbnails.medium.url
      }));
      memoriaBusquedas[llave] = { cuando: Date.now(), lista };
      // Solo guardamos las 60 más recientes para no llenar la memoria del móvil
      const llaves = Object.keys(memoriaBusquedas).sort((a, b) => memoriaBusquedas[b].cuando - memoriaBusquedas[a].cuando);
      llaves.slice(60).forEach(k => delete memoriaBusquedas[k]);
      guardar("memoriaBusquedas", memoriaBusquedas);
      return lista;
    }

    // Busca y pinta los resultados. tocarPrimera = true: suena la primera directo
    async function buscar(texto, tocarPrimera = false) {
      const id = idDeEnlace(texto);
      if (id) {   // Si pegaste un enlace, lo reproducimos directamente (no hace falta clave)
        const lista = [{ id, titulo: "Vídeo de YouTube", canal: "", img: `https://i.ytimg.com/vi/${id}/mqdefault.jpg` }];
        ultimaLista = { titulo: "Enlace", canciones: lista };
        pintarLista("Enlace", lista);
        return reproducirLista(lista, 0, "Enlace");
      }
      if (!leer("claveYT", "")) return mostrarBienvenida();
      $("tituloLista").textContent = "Buscando…";
      $("lista").innerHTML = "";
      try {
        const lista = await buscarEnYouTube(texto);
        ultimaLista = { titulo: 'Resultados para "' + texto + '"', canciones: lista };
        if (vistaActual === "buscar") pintarLista(ultimaLista.titulo, lista);
        if (tocarPrimera) reproducirLista(lista, 0, texto);
        else precargar(lista[0]?.id);   // la primera suele ser la que eliges: la vamos cargando
      } catch (e) {
        $("tituloLista").textContent = "Algo salió mal";
        $("lista").innerHTML = '<p class="aviso">Error al buscar: ' + e.message +
          '<br><br><button class="boton gris" id="btnCambiarClave">Cambiar clave de YouTube</button></p>';
        $("btnCambiarClave").onclick = mostrarBienvenida;
      }
    }

    // Para las recomendaciones: busca "artista - canción" y suena sin cambiar de pantalla
    async function tocarPorNombre(texto) {
      if (!leer("claveYT", "")) return mostrarBienvenida();
      try {
        const lista = await buscarEnYouTube(texto);
        reproducirLista(lista, 0, "Recomendado para ti");
      } catch (e) { alertaSuave("No se pudo reproducir: " + e.message); }
    }
    function alertaSuave(texto) { $("tituloLista").textContent = texto; }

    // YouTube manda textos como "Rock &amp; Roll"; esto lo deja en "Rock & Roll"
    function decodificar(t) {
      const el = document.createElement("textarea"); el.innerHTML = t; return el.value;
    }

    $("formBuscar").onsubmit = (e) => {
      e.preventDefault();   // evita que la página se recargue
      const texto = campo.value.trim();
      salirDeEscribir();
      if (texto) buscar(texto);
    };

    // =====================================================================
    // 3b) SUGERENCIAS mientras escribes (gratis, no gastan tu clave)
    // =====================================================================
    //  - Apple Music (iTunes): conoce todos los artistas y canciones, con portada.
    //  - Las sugerencias de YouTube: entienden frases de letras de canciones.
    const campo = $("campoBuscar");
    const cajaSug = $("sugerencias");
    const pais = (navigator.language.split("-")[1] || "CO").toUpperCase();
    let temporizador = null;
    let ultimaPeticion = 0;

    // Esperamos 250 ms después de cada letra para no preguntar por cada tecla
    campo.addEventListener("input", () => {
      clearTimeout(temporizador);
      const texto = campo.value.trim();
      if (!texto || idDeEnlace(texto)) { ultimaPeticion++; cajaSug.innerHTML = ""; return; }
      temporizador = setTimeout(() => pedirSugerencias(texto), 250);
    });

    async function pedirSugerencias(texto) {
      const numero = ++ultimaPeticion;   // para ignorar respuestas viejas que lleguen tarde
      const [canciones, frases] = await Promise.all([itunes(texto, 6), sugerenciasYouTube(texto)]);
      if (numero !== ultimaPeticion || campo.value.trim() !== texto) return;
      pintarSugerencias(canciones, frases);
    }

    // Busca canciones en el catálogo de Apple (gratis). Devuelve título, artista y portada.
    async function itunes(texto, cuantas) {
      try {
        const url = "https://itunes.apple.com/search?media=music&entity=song&limit=" + cuantas +
                    "&country=" + pais + "&term=" + encodeURIComponent(texto);
        const datos = await (await fetch(url)).json();
        return datos.results.map(c => ({
          titulo: c.trackName, artista: c.artistName,
          img: c.artworkUrl100.replace("100x100", "300x300")   // pedimos la portada más grande
        }));
      } catch { return []; }
    }

    // YouTube no deja leer sus sugerencias con fetch, pero sí con un truco antiguo
    // llamado JSONP: cargamos la respuesta como si fuera un <script>.
    function sugerenciasYouTube(texto) {
      return new Promise((resolver) => {
        const nombre = "sugYT" + Date.now();
        const script = document.createElement("script");
        const terminar = (lista) => { delete window[nombre]; script.remove(); resolver(lista); };
        window[nombre] = (datos) => terminar((datos[1] || []).map(x => Array.isArray(x) ? x[0] : x).slice(0, 4));
        script.onerror = () => terminar([]);
        setTimeout(() => window[nombre] && terminar([]), 3000);
        script.src = "https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&hl=es" +
                     "&q=" + encodeURIComponent(texto) + "&callback=" + nombre;
        document.head.appendChild(script);
      });
    }

    function pintarSugerencias(canciones, frases) {
      cajaSug.innerHTML = "";
      const escrito = campo.value.trim();
      const fila = (donde, html, alTocar) => {
        const el = document.createElement("div");
        el.className = "sug"; el.innerHTML = html;
        el.onclick = alTocar;
        donde.appendChild(el);
        return el;
      };
      // 1) Frases sugeridas: lo que ya escribiste en gris y lo que falta en blanco
      const grupoFrases = document.createElement("div");
      grupoFrases.className = "frases";
      cajaSug.appendChild(grupoFrases);
      frases.forEach(f => {
        const el = fila(grupoFrases, `<span class="lupa">${icono("buscar")}</span><div class="frase"></div>
          <button class="iconoBoton flecha" title="Completar">${icono("rellenar")}</button>`, () => {
          campo.value = f; salirDeEscribir(); buscar(f);
        });
        const frase = el.querySelector(".frase");
        if (f.toLowerCase().startsWith(escrito.toLowerCase())) {
          frase.innerHTML = '<span class="escrito"></span><span></span>';
          frase.children[0].textContent = f.slice(0, escrito.length);
          frase.children[1].textContent = f.slice(escrito.length);
        } else frase.textContent = f;
        // La flechita ↖ copia la frase al buscador para que sigas escribiendo
        el.querySelector(".flecha").onclick = (e) => {
          e.stopPropagation();
          campo.value = f + " "; campo.focus(); pedirSugerencias(f);
        };
      });
      // 2) Canciones con portada: al tocarlas suenan directo
      canciones.forEach(c => {
        const el = fila(cajaSug, '<img alt=""><div><div class="titulo"></div><div class="canal"></div></div>', () => {
          const texto = c.artista + " - " + c.titulo;
          campo.value = texto; salirDeEscribir();
          buscar(texto, true);   // la buscamos en YouTube y suena directo
        });
        el.querySelector("img").src = c.img;
        el.querySelector(".titulo").textContent = c.titulo;
        el.querySelector(".canal").textContent = "Canción • " + c.artista;
      });
    }

    // ----- Entrar y salir del modo "escribiendo" -----
    function entrarAEscribir() {
      if ($("contenido").classList.contains("escribiendo")) return;
      $("contenido").classList.add("escribiendo");
      history.pushState({ vista: vistaActual, capa: "busqueda" }, "");   // el "atrás" lo cierra
    }
    function salirDeEscribir() {
      clearTimeout(temporizador); ultimaPeticion++;
      campo.blur();         // esconde el teclado del móvil
      if (!$("contenido").classList.contains("escribiendo")) return;
      $("contenido").classList.remove("escribiendo");
      if (history.state?.capa === "busqueda") history.replaceState({ vista: vistaActual }, "");
    }
    function cerrarSugerencias() { salirDeEscribir(); }
    campo.addEventListener("focus", entrarAEscribir);
    campo.addEventListener("keydown", (e) => { if (e.key === "Escape") salirDeEscribir(); });
    $("volverBusqueda").onclick = () => {
      if (history.state?.capa === "busqueda") history.back(); else salirDeEscribir();
    };
    $("borrarBusqueda").onclick = () => { campo.value = ""; cajaSug.innerHTML = ""; campo.focus(); };

    // =====================================================================
    // 4) INICIO: accesos rápidos, lo reciente y recomendaciones
    // =====================================================================
    let recomendaciones = null;   // las guardamos para no pedirlas cada vez que entras

    function saludo() {
      const h = new Date().getHours();
      return h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
    }

    // Número de versión: sale al final del Inicio para saber si tienes la última
    const VERSION = "22 · 31 oct";

    function mostrarInicio() {
      $("tituloLista").textContent = "";
      const lista = $("lista");
      lista.innerHTML = `<div class="saludo">${saludo()}</div><div class="accesos" id="accesos"></div>`;

      // Accesos rápidos (cuadritos de 2 en 2): tus carpetas y lo último que escuchaste
      const accesos = $("accesos");
      const cuadrito = (tapaHtml, nombre, alTocar) => {
        const el = document.createElement("div");
        el.className = "tile";
        el.innerHTML = tapaHtml + "<span></span>";
        el.querySelector("span").textContent = nombre;
        el.onclick = alTocar;
        accesos.appendChild(el);
      };
      carpetas.slice(0, 4).forEach(k => cuadrito(tapaDe(k), k.nombre, () => cambiarVista("carpeta:" + k.id)));
      historial.slice(0, 8 - accesos.children.length).forEach((c, i) =>
        cuadrito(`<img class="tapa" src="${c.img}" alt="">`, c.titulo, () => reproducirLista(historial, i, "Escuchado recientemente")));

      // Escuchado recientemente (suena directo, no gasta tu clave porque ya sabemos su id)
      if (historial.length) {
        seccion("Escuchado recientemente", historial.slice(0, 15).map((c, i) => ({
          titulo: c.titulo, artista: c.canal, img: c.img,
          alTocar: () => reproducirLista(historial, i, "Escuchado recientemente"),
          id: c.id
        })));
      }

      const pie = document.createElement("p");
      pie.className = "aviso version";
      pie.textContent = "Mi Música · versión " + VERSION;
      setTimeout(() => $("lista").appendChild(pie), 0);   // siempre al final
      // Recomendaciones (de Apple Music, gratis). Mientras cargan, cajitas "fantasma".
      if (recomendaciones) recomendaciones.forEach(s => seccion(s.titulo, s.canciones));
      else {
        const cargando = seccion("Recomendado para ti", Array(6).fill(null));
        cargarRecomendaciones().then(() => {
          cargando.remove();
          if (vistaActual === "inicio") { recomendaciones.forEach(s => seccion(s.titulo, s.canciones)); $("lista").appendChild(pie); }
        });
      }
    }

    // Dibuja una fila deslizable de tarjetas. canciones = null → tarjeta "cargando"
    function seccion(titulo, canciones) {
      const s = document.createElement("div");
      s.className = "seccion";
      s.innerHTML = '<h3></h3><div class="fila"></div>';
      s.querySelector("h3").textContent = titulo;
      const fila = s.querySelector(".fila");
      canciones.forEach(c => {
        const t = document.createElement("div");
        t.className = "tarjetaRec";
        if (!c) { t.innerHTML = '<img class="esqueleto" alt="">'; fila.appendChild(t); return; }
        t.innerHTML = `<img src="${c.img}" alt="" loading="lazy"><div class="titulo"></div><div class="canal"></div>`;
        t.querySelector(".titulo").textContent = c.titulo;
        t.querySelector(".canal").textContent = c.artista;
        t.onclick = c.alTocar || (() => tocarPorNombre(c.artista + " - " + c.titulo));
        if (c.id) t.onpointerdown = () => precargar(c.id);
        fila.appendChild(t);
      });
      $("lista").appendChild(s);
      return s;
    }

    // Mira qué artistas escuchas más y pide a Apple canciones parecidas
    async function cargarRecomendaciones() {
      const cuenta = {};
      [...historial, ...carpetas.flatMap(k => k.canciones)].forEach(c => {
        const artista = limpiarArtista(c.canal);
        if (artista) cuenta[artista] = (cuenta[artista] || 0) + 1;
      });
      let favoritos = Object.keys(cuenta).sort((a, b) => cuenta[b] - cuenta[a]).slice(0, 3);
      // Si aún no has escuchado nada, usamos artistas populares
      const populares = ["Bad Bunny", "Karol G", "Feid", "Shakira", "Peso Pluma", "Ryan Castro", "Blessd", "Daddy Yankee"];
      if (!favoritos.length) favoritos = populares.sort(() => Math.random() - 0.5).slice(0, 3);
      const resultados = await Promise.all(favoritos.map(a => itunes(a, 12)));
      recomendaciones = [];
      // Mezcla de todo: "Recomendado para ti"
      const mezcla = resultados.flat().sort(() => Math.random() - 0.5).slice(0, 12);
      if (mezcla.length) recomendaciones.push({ titulo: "Recomendado para ti", canciones: mezcla });
      // Y una fila por artista: "Más de …"
      favoritos.forEach((a, i) => {
        if (resultados[i].length) recomendaciones.push({ titulo: "Más de " + a, canciones: resultados[i] });
      });
    }
    // "Daddy Yankee - Topic" o "DaddyYankeeVEVO" → "Daddy Yankee"
    function limpiarArtista(nombre = "") {
      return nombre.replace(/\s*-\s*Topic$/i, "").replace(/VEVO$/i, "").replace(/\s*(Official|Oficial).*$/i, "").trim();
    }

    // =====================================================================
    // 5) PINTAR una lista de canciones
    // =====================================================================
    function guardarCarpetas() { guardar("carpetas", carpetas); }
    // ¿Son la misma canción? Mismo vídeo, o mismo título aunque sea otro vídeo de YouTube
    // (por ejemplo, el vídeo oficial y el "Topic" de la misma canción)
    const limpio = (t = "") => t.toLowerCase().replace(/\(.*?\)|\[.*?\]/g, "").replace(/[^a-z0-9ñáéíóú]+/g, " ").trim();
    function mismaCancion(a, b) { return a.id === b.id || (limpio(a.titulo) !== "" && limpio(a.titulo) === limpio(b.titulo)); }
    function estaGuardada(c) { return carpetas.some(k => k.canciones.some(x => mismaCancion(x, c))); }

    let listaPintada = null;
    let nombreListaPintada = "";
    function pintarLista(titulo, canciones, cabecera = null) {
      $("tituloLista").textContent = titulo;
      const lista = $("lista");
      lista.innerHTML = "";
      if (cabecera) lista.appendChild(cabecera);
      listaPintada = canciones;
      nombreListaPintada = titulo || "Mi Música";
      if (canciones.length === 0) {
        lista.insertAdjacentHTML("beforeend", '<p class="aviso">No hay canciones aquí todavía. Toca el corazón de una canción para guardarla.</p>');
        return;
      }
      canciones.forEach((c, i) => {
        const fila = document.createElement("div");
        fila.className = "cancion";
        fila.dataset.indice = i;
        fila.innerHTML = `
          <span class="num">${i + 1}</span>
          <img src="${c.img}" alt="" loading="lazy">
          <div style="min-width:0"><div class="titulo"></div><div class="canal"></div></div>
          <button class="corazon" title="Guardar en carpeta"></button>`;
        // textContent (y no innerHTML) para que un título raro no rompa la página
        fila.querySelector(".titulo").textContent = c.titulo;
        fila.querySelector(".canal").textContent = c.canal;
        pintarCorazon(fila.querySelector(".corazon"), c);
        fila.onclick = () => reproducirLista(canciones, i, nombreListaPintada);
        // Truco: en cuanto APOYAS el dedo (antes de soltarlo) ya empieza a cargar
        fila.onpointerdown = () => precargar(c.id);
        fila.querySelector(".corazon").onclick = (e) => { e.stopPropagation(); abrirHoja(c); };
        lista.appendChild(fila);
      });
      marcarSonando();
    }
    function pintarCorazon(btn, cancion) {
      const si = estaGuardada(cancion);
      btn.classList.toggle("lleno", si);
      btn.innerHTML = icono(si ? "corazonLleno" : "corazon");
    }

    // Pone en verde (con barritas que bailan) la canción que está sonando
    function marcarSonando() {
      todos(".cancion").forEach(f => {
        const i = Number(f.dataset.indice);
        const suena = listaPintada === cola && i === posicion;
        f.classList.toggle("sonando", suena);
        f.querySelector(".num").innerHTML = suena ? '<span class="ecualizador"><i></i><i></i><i></i></span>' : i + 1;
      });
    }

    let ultimaLista = { titulo: "", canciones: [] };
    function repintar() {
      if (vistaActual === "biblioteca") mostrarBiblioteca();
      else if (vistaActual.startsWith("carpeta:")) mostrarCarpeta(vistaActual.slice(8));
      else if (vistaActual === "buscar" && ultimaLista.canciones.length) pintarLista(ultimaLista.titulo, ultimaLista.canciones);
      if (posicion >= 0) todos(".corazonActual").forEach(b => pintarCorazon(b, cola[posicion]));
    }

    // =====================================================================
    // 6) CARPETAS (tu biblioteca)
    // =====================================================================
    function crearCarpeta(nombre) {
      nombre = nombre.trim();
      if (!nombre) return null;
      const nueva = { id: "c" + Date.now(), nombre, canciones: [] };
      carpetas.push(nueva);
      guardarCarpetas();
      return nueva;
    }

    // La "tapa" de una carpeta: Favoritos tiene corazón (como "Tus me gusta");
    // las demás, la portada de su primera canción o una nota musical
    function tapaDe(k, clase = "tapa") {
      if (k.id === "fav") return `<div class="${clase}">${icono("corazonLleno")}</div>`;
      return k.canciones.length
        ? `<img class="${clase}" src="${k.canciones[0].img}" alt="">`
        : `<div class="${clase} nota">${icono("nota")}</div>`;
    }
    function cuantas(n) { return n + (n === 1 ? " canción" : " canciones"); }

    function mostrarBiblioteca() {
      $("tituloLista").textContent = "Tu biblioteca";
      const lista = $("lista");
      lista.innerHTML = `
        <form class="nuevaCarpeta" id="formNueva">
          <input id="nombreNueva" placeholder="Nombre de la nueva carpeta" autocomplete="off">
          <button class="boton">${icono("mas")}Crear</button>
        </form>
        <div class="carpetas" id="gridCarpetas"></div>`;
      $("formNueva").onsubmit = (e) => {
        e.preventDefault();
        if (crearCarpeta($("nombreNueva").value)) mostrarBiblioteca();
      };
      carpetas.forEach(k => {
        const el = document.createElement("div");
        el.className = "carpeta";
        el.innerHTML = tapaDe(k) + '<div class="titulo"></div><div class="canal"></div>';
        el.querySelector(".titulo").textContent = k.nombre;
        el.querySelector(".canal").textContent = "Carpeta · " + cuantas(k.canciones.length);
        el.onclick = () => cambiarVista("carpeta:" + k.id);
        $("gridCarpetas").appendChild(el);
      });
    }

    function mostrarCarpeta(id) {
      const k = carpetas.find(x => x.id === id);
      if (!k) return cambiarVista("biblioteca");
      const cab = document.createElement("div");
      cab.innerHTML = `
        <div class="cabCarpeta">
          ${tapaDe(k)}
          <div style="min-width:0"><small>Carpeta</small><h3></h3><div class="canal">${cuantas(k.canciones.length)}</div></div>
        </div>
        <div class="acciones">
          <button class="botonPlayGrande" title="Reproducir todo">${icono("play")}</button>
          <button class="iconoBoton" data-a="mezclar" title="Aleatorio">${icono("aleatorio")}</button>
          <button class="iconoBoton" data-a="volver" title="Volver a la biblioteca">${icono("atras")}</button>
          ${k.id === "fav" ? "" : `<button class="iconoBoton borrar" data-a="borrar" title="Borrar carpeta">${icono("basura")}</button>`}
        </div>`;
      cab.querySelector("h3").textContent = k.nombre;
      // ▶ Reproducir: la cola pasa a ser TODA la carpeta, empezando por la primera
      cab.querySelector(".botonPlayGrande").onclick = () => { if (k.canciones.length) reproducirLista(k.canciones, 0, k.nombre); };
      cab.querySelector('[data-a="mezclar"]').onclick = () => {
        if (k.canciones.length) reproducirLista([...k.canciones].sort(() => Math.random() - 0.5), 0, k.nombre);
      };
      cab.querySelector('[data-a="volver"]').onclick = () => cambiarVista("biblioteca");
      const borrar = cab.querySelector('[data-a="borrar"]');
      if (borrar) borrar.onclick = () => {
        // Primer toque avisa, segundo toque borra (sin ventanitas)
        if (borrar.classList.contains("seguro")) {
          carpetas = carpetas.filter(x => x.id !== id); guardarCarpetas(); cambiarVista("biblioteca");
        } else { borrar.classList.add("seguro"); borrar.innerHTML = icono("basura") + "¿Borrar? Toca otra vez"; }
      };
      pintarLista(k.nombre, k.canciones, cab);
      precargar(k.canciones[0]?.id);   // por si le das a ▶, ya va cargando
      $("tituloLista").textContent = "";
    }

    // ----- Hoja "Guardar en carpeta" -----
    let cancionHoja = null;
    function abrirHoja(c) {
      cancionHoja = c;
      $("hojaCancion").textContent = c.titulo;
      pintarHoja();
      $("fondoHoja").hidden = false;
      history.pushState({ vista: vistaActual, capa: "hoja" }, "");
    }
    function pintarHoja() {
      const caja = $("hojaCarpetas");
      caja.innerHTML = "";
      carpetas.forEach(k => {
        const dentro = k.canciones.some(x => mismaCancion(x, cancionHoja));
        const b = document.createElement("button");
        b.className = "opcionCarpeta";
        b.innerHTML = tapaDe(k, "mini") + `<span class="nombre"></span><span class="check ${dentro ? "si" : ""}">${dentro ? icono("check") : ""}</span>`;
        b.querySelector(".nombre").textContent = k.nombre;
        // Tocar una carpeta mete o saca la canción de ella
        b.onclick = () => {
          if (dentro) k.canciones = k.canciones.filter(x => !mismaCancion(x, cancionHoja));
          else k.canciones.push(cancionHoja);
          guardarCarpetas(); pintarHoja();
        };
        caja.appendChild(b);
      });
    }
    $("hojaNueva").onsubmit = (e) => {
      e.preventDefault();
      const nueva = crearCarpeta($("hojaNombre").value);
      if (!nueva) return;
      nueva.canciones.push(cancionHoja);   // la canción entra directo en la carpeta nueva
      guardarCarpetas(); $("hojaNombre").value = ""; pintarHoja();
    };
    function cerrarHoja() {
      if (history.state?.capa === "hoja") return history.back();   // el "atrás" la cierra
      $("fondoHoja").hidden = true; repintar();
    }
    $("hojaListo").onclick = cerrarHoja;
    $("fondoHoja").onclick = (e) => { if (e.target.id === "fondoHoja") cerrarHoja(); };

    // ----- Cambiar de pestaña (Inicio / Buscar / Tu biblioteca) -----
    let vistaActual = "inicio";
    // desdeAtras = true cuando venimos del botón "atrás" del móvil (no apuntamos otra vez)
    function cambiarVista(vista, pintar = true, desdeAtras = false) {
      if (pintar && !desdeAtras && vista !== vistaActual) history.pushState({ vista }, "");
      vistaActual = vista;
      const menu = vista.startsWith("carpeta:") ? "biblioteca" : vista;
      todos(".menu").forEach(b => b.classList.toggle("activo", b.dataset.vista === menu));
      $("formBuscar").hidden = vista !== "buscar";
      $("contenido").classList.remove("escribiendo");
      $("contenido").scrollTop = 0;
      if (!pintar) return;
      if (vista === "inicio") mostrarInicio();
      else if (vista === "biblioteca") mostrarBiblioteca();
      else if (vista.startsWith("carpeta:")) mostrarCarpeta(vista.slice(8));
      else {   // Buscar
        if (!leer("claveYT", "")) return mostrarBienvenida();
        if (ultimaLista.canciones.length) pintarLista(ultimaLista.titulo, ultimaLista.canciones);
        else { $("tituloLista").textContent = ""; $("lista").innerHTML = '<p class="aviso">Escribe una canción, un artista o un trozo de la letra. 🎧</p>'; }
      }
    }
    todos(".menu").forEach(b => b.onclick = () => cambiarVista(b.dataset.vista));

    // =====================================================================
    // 7) EL REPRODUCTOR (YouTube IFrame API) con PRECARGA
    // =====================================================================
    // Truco tipo Spotify: tenemos TRES reproductores.
    //  - Uno suena.
    //  - Otro tiene cargada la canción SIGUIENTE (en silencio y en pausa).
    //  - Otro tiene cargada la canción ANTERIOR.
    // Al pulsar ⏭ o ⏮ solo cambiamos de reproductor: ¡suena al instante!
    function onYouTubeIframeAPIReady() {
      [0, 1, 2].forEach(n => {
        jugadores[n] = new YT.Player("reproductorYT" + n, {
          width: "100%", height: "100%",
          // controls: 0 quita los botones de YouTube (usamos los nuestros)
          playerVars: { playsinline: 1, controls: 0, rel: 0, fs: 0, iv_load_policy: 3, disablekb: 1 },
          events: {
            onReady: () => {
              jugadores[n].setVolume(volumen);
              jugadores[n].getIframe().classList.toggle("dormido", n !== activo);
            },
            onStateChange: (e) => alCambiarEstado(n, e.data)
          }
        });
      });
      reproductor = jugadores[activo];
    }
    const todosListos = () => jugadores.length === 3 && jugadores.every(j => j?.loadVideoById);

    function alCambiarEstado(n, estado) {
      const E = YT.PlayerState;
      if (n === activo) {
        if (estado === E.ENDED) siguiente();
        if (estado === E.PLAYING) { precargarVecinas(); silencio.play().catch(() => {}); }
        if (estado === E.PAUSED) silencio.pause();
        if ("mediaSession" in navigator && (estado === E.PLAYING || estado === E.PAUSED))
          navigator.mediaSession.playbackState = estado === E.PLAYING ? "playing" : "paused";
        ponerIconoPlay(estado === E.PLAYING);
        // Mientras carga, el botón de play da vueltas (así sabes que ya va)
        todos(".btnPlay").forEach(b => b.classList.toggle("cargando", estado === E.BUFFERING || estado === -1));
      } else if (estado === E.PLAYING) {
        // Uno de reserva: en cuanto arranca, lo pausamos al principio (ya está cargado)
        jugadores[n].pauseVideo();
        jugadores[n].seekTo(0, true);
      }
    }

    function ponerIconoPlay(sonando) {
      const nuevo = sonando ? "pausa" : "play";
      todos(".btnPlay").forEach(btn => {
        if (btn.dataset.icono === nuevo) return;
        btn.dataset.icono = nuevo;
        btn.innerHTML = icono(nuevo);
        // Pequeño "latido" cuando cambia entre play y pausa
        btn.classList.remove("latido"); void btn.offsetWidth; btn.classList.add("latido");
      });
    }

    // Deja la anterior y la siguiente cargadas en los reproductores de reserva
    function precargarVecinas() {
      if (!todosListos()) return;
      const queremos = [cola[posicion + 1]?.id, cola[posicion - 1]?.id].filter(Boolean);
      queremos.forEach(id => {
        if (cargado.some((x, n) => x === id && n !== activo)) return;   // ya está cargada
        const libre = [0, 1, 2].find(n => n !== activo && !queremos.includes(cargado[n]));
        if (libre === undefined) return;
        cargado[libre] = id;
        jugadores[libre].mute();
        jugadores[libre].loadVideoById(id);
      });
    }

    // Carga una canción en un reproductor libre, en silencio, por si la eligen
    function precargar(id) {
      if (!id || !todosListos() || cargado.includes(id)) return;
      const libre = [0, 1, 2].find(n => n !== activo && cargado[n] !== cola[posicion + 1]?.id && cargado[n] !== cola[posicion - 1]?.id);
      if (libre === undefined) return;
      cargado[libre] = id;
      jugadores[libre].mute();
      jugadores[libre].loadVideoById(id);
    }

    function cambiarA(n) {
      const viejo = jugadores[activo];
      viejo.pauseVideo();                 // no la paramos del todo: así "anterior" es instantáneo
      viejo.mute();
      activo = n;
      reproductor = jugadores[n];
      jugadores.forEach((j, k) => j.getIframe().classList.toggle("dormido", k !== activo));
    }

    // Empieza a sonar una lista desde la canción número i
    function reproducirLista(lista, i, nombre) {
      cola = lista;
      nombreCola = nombre || "Mi Música";
      tocar(i);
    }

    function tocar(i) {
      if (!cola[i]) return;
      posicion = i;
      const c = cola[i];
      if (todosListos()) {
        const listo = cargado.findIndex((id, n) => id === c.id && n !== activo);
        if (listo >= 0) {
          // ¡Ya estaba cargada! Cambiamos a ese reproductor y suena al instante
          cambiarA(listo);
          reproductor.seekTo(0, true);
          reproductor.unMute(); reproductor.setVolume(volumen);
          reproductor.playVideo();
          // Plan B: si a los 4 segundos ni siquiera empezó (el navegador no la dejó),
          // la cargamos de la forma normal. Si está "cargando", la dejamos tranquila.
          const este = reproductor;
          setTimeout(() => {
            const st = este.getPlayerState();
            if (este === reproductor && posicion === i && (st === -1 || st === YT.PlayerState.CUED))
              este.loadVideoById(c.id);
          }, 4000);
        } else {
          cargado[activo] = c.id;
          reproductor.unMute(); reproductor.setVolume(volumen);
          reproductor.loadVideoById(c.id);
        }
      }
      // Ponemos el nombre, artista y portada en el mini y en la pantalla grande
      $("mini").hidden = false;
      todos(".tapaActual").forEach(img => img.src = c.img);
      todos(".nombreActual").forEach(el => el.textContent = c.titulo);
      todos(".artistaActual").forEach(el => el.textContent = c.canal);
      todos(".corazonActual").forEach(b => pintarCorazon(b, c));
      $("desde").textContent = nombreCola;
      $("portada").src = `https://i.ytimg.com/vi/${c.id}/hqdefault.jpg`;
      document.title = c.titulo + " · Mi Música";
      actualizarNotificacion(c);
      apuntarEnHistorial(c);
      todos(".btnPlay").forEach(b => b.classList.add("cargando"));
      ponerProgreso(0, 0);
      marcarSonando();
    }

    function apuntarEnHistorial(c) {
      historial = [c, ...historial.filter(x => x.id !== c.id)].slice(0, 30);
      guardar("historial", historial);
    }

    function siguiente() { if (posicion < cola.length - 1) tocar(posicion + 1); }
    // Como en Spotify: si la canción ya lleva más de 3 segundos, ⏮ la empieza de nuevo
    function anterior() {
      if (reproductor?.getCurrentTime && reproductor.getCurrentTime() > 3) return reproductor.seekTo(0, true);
      if (posicion > 0) tocar(posicion - 1);
    }
    function playPausa() {
      if (!reproductor || posicion < 0) return;
      if (reproductor.getPlayerState() === YT.PlayerState.PLAYING) reproductor.pauseVideo();
      else reproductor.playVideo();
    }

    // Todos los botones con data-accion (del mini y de la pantalla grande)
    todos("[data-accion]").forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      ({ play: playPausa, siguiente, anterior })[b.dataset.accion]();
    });
    todos(".corazonActual").forEach(b => b.onclick = (e) => { e.stopPropagation(); if (posicion >= 0) abrirHoja(cola[posicion]); });

    // Abrir y cerrar la pantalla grande
    function abrirPantalla() {
      if ($("pantalla").classList.contains("abierta")) return;
      $("pantalla").classList.add("abierta");
      history.pushState({ vista: vistaActual, capa: "pantalla" }, "");
    }
    function cerrarPantalla() {
      if (history.state?.capa === "pantalla") return history.back();   // el "atrás" la cierra
      $("pantalla").classList.remove("abierta");
    }
    $("abrirPantalla").onclick = (e) => { e.stopPropagation(); abrirPantalla(); };
    $("mini").onclick = () => { if (window.innerWidth <= 700) abrirPantalla(); };
    $("cerrarPantalla").onclick = cerrarPantalla;

    // =====================================================================
    // BOTÓN "ATRÁS" DEL MÓVIL
    // =====================================================================
    // Cada vez que cambias de pantalla, la apuntamos en el "historial" del navegador
    // (history.pushState). Cuando tocas "atrás", el navegador nos avisa con el
    // evento "popstate" y volvemos a la pantalla anterior en vez de salir de la app.
    window.addEventListener("popstate", (e) => {
      const estado = e.state || { vista: "inicio" };
      // Primero cerramos lo que esté abierto encima (pantalla grande u hoja)
      if (estado.capa !== "pantalla") $("pantalla").classList.remove("abierta");
      if (estado.capa !== "busqueda") { $("contenido").classList.remove("escribiendo"); campo.blur(); }
      if (estado.capa !== "hoja" && !$("fondoHoja").hidden) { $("fondoHoja").hidden = true; repintar(); }
      if (estado.vista && estado.vista !== vistaActual) cambiarVista(estado.vista, true, true);
    });

    // Volumen
    const barraVolumen = $("barraVolumen");
    barraVolumen.oninput = () => {
      volumen = Number(barraVolumen.value);
      barraVolumen.style.setProperty("--pct", volumen + "%");   // pinta la parte llena
      reproductor?.setVolume(volumen);
    };

    // Barras de tiempo (hay dos: la del mini en ordenador y la de la pantalla grande)
    let arrastrando = false;
    todos(".barraTiempo").forEach(barra => {
      barra.addEventListener("pointerdown", () => arrastrando = true);
      barra.addEventListener("click", (e) => e.stopPropagation());
      barra.addEventListener("change", () => {
        arrastrando = false;
        if (reproductor?.getDuration) reproductor.seekTo(reproductor.getDuration() * barra.value / 1000, true);
      });
      barra.oninput = () => barra.style.setProperty("--pct", barra.value / 10 + "%");
    });

    function formato(seg) { seg = Math.floor(seg || 0); return Math.floor(seg / 60) + ":" + String(seg % 60).padStart(2, "0"); }
    function ponerProgreso(actual, total) {
      todos(".tActual").forEach(el => el.textContent = formato(actual));
      todos(".tTotal").forEach(el => el.textContent = formato(total));
      const pct = total ? actual / total * 100 : 0;
      $("rayita").style.width = pct + "%";
      if (arrastrando) return;
      todos(".barraTiempo").forEach(b => { b.value = pct * 10; b.style.setProperty("--pct", pct + "%"); });
    }
    // Cada medio segundo actualizamos el tiempo
    setInterval(() => {
      if (!reproductor?.getDuration || posicion < 0) return;
      ponerProgreso(reproductor.getCurrentTime(), reproductor.getDuration());
    }, 500);

    // =====================================================================
    // 8) CONTROLES EN LA NOTIFICACIÓN DEL MÓVIL (⏮ ⏯ ⏭)
    // =====================================================================
    // "Media Session" le dice al móvil qué suena y qué hacer con los botones
    // de la notificación. El móvil solo nos hace caso si NUESTRA página suena,
    // así que reproducimos un audio de silencio en bucle mientras suena la música.
    const silencio = new Audio(crearSilencio());
    silencio.loop = true;

    // Crea 1 segundo de silencio como archivo de audio WAV, sin descargar nada
    function crearSilencio() {
      const muestras = 8000, datos = new DataView(new ArrayBuffer(44 + muestras * 2));
      const texto = (pos, t) => [...t].forEach((l, i) => datos.setUint8(pos + i, l.charCodeAt(0)));
      texto(0, "RIFF"); datos.setUint32(4, 36 + muestras * 2, true); texto(8, "WAVE");
      texto(12, "fmt "); datos.setUint32(16, 16, true); datos.setUint16(20, 1, true); datos.setUint16(22, 1, true);
      datos.setUint32(24, 8000, true); datos.setUint32(28, 16000, true); datos.setUint16(32, 2, true); datos.setUint16(34, 16, true);
      texto(36, "data"); datos.setUint32(40, muestras * 2, true);
      return URL.createObjectURL(new Blob([datos], { type: "audio/wav" }));
    }

    function actualizarNotificacion(c) {
      if (!("mediaSession" in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: c.titulo, artist: c.canal, album: "Mi Música",
        artwork: [{ src: `https://i.ytimg.com/vi/${c.id}/hqdefault.jpg`, sizes: "480x360", type: "image/jpeg" }]
      });
    }
    if ("mediaSession" in navigator) {
      const accion = (nombre, hacer) => { try { navigator.mediaSession.setActionHandler(nombre, hacer); } catch {} };
      accion("play", () => reproductor?.playVideo());
      accion("pause", () => reproductor?.pauseVideo());
      accion("nexttrack", () => siguiente());
      accion("previoustrack", () => anterior());
    }

    // ----- Ver vídeo o solo música -----
    function aplicarModoVideo() {
      const ver = leer("verVideo", false);
      $("video").classList.toggle("conVideo", ver);
      $("btnVideo").innerHTML = ver ? icono("nota") + "Solo música" : icono("video") + "Ver vídeo";
    }
    $("btnVideo").onclick = () => { guardar("verVideo", !leer("verVideo", false)); aplicarModoVideo(); };
    aplicarModoVideo();

    // ----- ¿Estás usando Brave? -----
    // Brave añade "navigator.brave" al navegador; los demás navegadores no lo tienen.
    async function comprobarBrave() {
      let esBrave = false;
      try { esBrave = !!(navigator.brave && await navigator.brave.isBrave()); } catch {}
      if (esBrave || leer("ocultarAvisoBrave", false)) return;
      const enlace = $("enlaceBrave");
      const ua = navigator.userAgent;
      if (/Android/i.test(ua)) {
        // Enlace especial de Android: si Brave está instalado abre la app ahí;
        // si no, Android abre la Play Store directamente en Brave para instalarlo.
        const direccion = location.host + location.pathname;
        enlace.href = "intent://" + direccion + "#Intent;scheme=https;package=com.brave.browser;" +
          "S.browser_fallback_url=" + encodeURIComponent("https://play.google.com/store/apps/details?id=com.brave.browser") + ";end";
      } else if (/iPhone|iPad|iPod/i.test(ua)) {
        enlace.href = "https://apps.apple.com/app/brave-private-web-browser/id1052879175";
        enlace.textContent = "Instalar Brave";
      } else {
        enlace.textContent = "Descargar Brave";
      }
      $("avisoBrave").hidden = false;
    }
    $("cerrarAvisoBrave").onclick = () => { guardar("ocultarAvisoBrave", true); $("avisoBrave").hidden = true; };
    comprobarBrave();

    // Registramos el ayudante para que se pueda instalar como app
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    ponerIconoPlay(false);
    history.replaceState({ vista: "inicio" }, "");   // primera página del historial
    cambiarVista("inicio", true, true);   // lo primero que se ve al abrir la app

    // Atajo: barra espaciadora = play/pausa (si no estás escribiendo)
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target.tagName !== "INPUT") { e.preventDefault(); playPausa(); }
    });
  </script>
</body>
</html>
