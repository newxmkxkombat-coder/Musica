<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Música</title>
  <!-- Para poder instalarla como app en el móvil, con su logo -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="iconos/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
  <meta name="theme-color" content="#0b0b0c">
  <!-- Tipografía "Figtree": redondita y moderna, parecida a la de Spotify -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Le decimos al navegador que vaya conectando con YouTube desde ya (carga más rápido) -->
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <style>
    /* ===== COLORES Y MEDIDAS (variables): cámbialos aquí y cambia toda la app ===== */
    :root {
      --fondo: #0b0b0c;          /* negro casi puro, el fondo de todo */
      --panel: #151517;          /* tarjetas y paneles */
      --tarjeta: #1f1f22;        /* cosas un poco más claras */
      --hover: #2a2a2e;          /* al pasar el dedo/ratón */
      --borde: #ffffff14;        /* bordes finitos y transparentes */
      --texto: #f5f5f7;
      --gris: #a1a1aa;
      --gris2: #6b6b73;
      --verde: #1ed760;
      --verde2: #17b84f;
      --radio: 12px;
      --fuente: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--fondo);
      color: var(--texto);
      font-family: var(--fuente);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-columns: 260px 1fr;   /* barra lateral + contenido */
      grid-template-rows: 1fr auto;       /* contenido + barra del reproductor */
      gap: 8px;
      padding: 8px;
      overflow: hidden;
    }
    button { font-family: inherit; }
    img { display: block; }

    /* ----- Iconos (dibujos SVG) ----- */
    .ic { width: 20px; height: 20px; fill: currentColor; flex: none; }
    .ic.linea { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ----- Botones: sin el marco azul y con animación al pulsar ----- */
    button, a, .cancion, .carpeta, .sug { -webkit-tap-highlight-color: transparent; }
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }   /* solo con teclado */
    button { transition: transform .12s ease, background-color .15s ease, color .15s ease, filter .15s ease; }
    button:active { transform: scale(.9); }
    .cancion, .carpeta { transition: transform .12s ease, background-color .15s ease; }
    .cancion:active, .carpeta:active { transform: scale(.985); }
    @keyframes latido { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
    .latido { animation: latido .28s ease; }
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.35); } 100% { transform: scale(1); } }
    .pop { animation: pop .3s ease; }
    @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }

    /* Botón verde principal y botón "fantasma" con borde */
    .boton {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--verde); color: #000; border: none; border-radius: 999px;
      padding: 11px 20px; font-weight: 700; font-size: 14px; cursor: pointer;
      box-shadow: 0 6px 18px #1ed76033;
    }
    .boton:hover { background: #3be477; }
    .boton.gris { background: transparent; color: var(--texto); border: 1px solid #ffffff2e; box-shadow: none; }
    .boton.gris:hover { border-color: var(--texto); }
    .iconoBoton {
      display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
      background: none; border: none; color: var(--gris); cursor: pointer;
    }
    .iconoBoton:hover { color: var(--texto); background: #ffffff0f; }

    /* ----- Barra lateral (izquierda) ----- */
    aside {
      background: var(--panel); border-radius: var(--radio); border: 1px solid var(--borde);
      padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; min-height: 0;
    }
    .marca { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; margin: 0 8px 20px; letter-spacing: -.3px; }
    .marca span { color: var(--verde); }
    .logo { width: 34px; height: 34px; filter: drop-shadow(0 4px 10px #1ed76055); }
    .menu {
      display: flex; align-items: center; gap: 14px;
      background: none; border: none; color: var(--gris); text-align: left; padding: 11px 12px;
      border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; position: relative;
    }
    .menu:hover { color: var(--texto); }
    .menu.activo { color: var(--texto); background: var(--tarjeta); }
    .menu.activo::before {   /* rayita verde a la izquierda del menú activo */
      content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--verde);
    }
    .menu .ic { width: 22px; height: 22px; }

    .sonandoAhora { margin-top: auto; display: none; padding: 12px; border-radius: 10px; background: var(--tarjeta); border: 1px solid var(--borde); }
    .sonandoAhora.visible { display: block; }
    .sonandoAhora p { color: var(--gris); font-size: 11px; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1.2px; }
    .linkClave { background: none; border: none; color: var(--gris); font-size: 12px; cursor: pointer; padding: 8px 12px; text-align: left; }
    .linkClave:hover { color: var(--texto); }
    .linkClave[hidden] { display: none; }

    /* El vídeo se recorta en un cuadrado para que parezca la portada de un disco.
       YouTube pide que su reproductor se vea (mínimo 200x200). */
    #video { position: relative; width: 200px; height: 200px; margin: 0 auto;
             border-radius: 10px; overflow: hidden; background: #000; box-shadow: 0 12px 32px #000a; }
    #video iframe { position: absolute; top: 0; left: 50%; width: 356px; height: 200px; transform: translateX(-50%); }
    #video iframe.dormido { opacity: 0; pointer-events: none; }   /* los reproductores que precargan */
    /* Portada: la imagen de la canción tapa el vídeo (modo "solo música") */
    #portada { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    #video.conVideo #portada { display: none; }
    #btnVideo {
      position: absolute; right: 8px; bottom: 8px; z-index: 2; display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid #ffffff26; cursor: pointer; background: #000000b3; backdrop-filter: blur(8px);
      color: var(--texto); font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px;
    }
    #btnVideo .ic { width: 14px; height: 14px; }

    /* ----- Contenido principal ----- */
    main {
      overflow-y: auto; padding: 20px 28px 32px; border-radius: var(--radio); border: 1px solid var(--borde);
      background: linear-gradient(180deg, #1c3a28 0%, var(--panel) 260px);   /* brillo verde arriba */
      min-width: 0;
    }
    .buscador { margin-bottom: 24px; max-width: 520px; position: relative; }
    .buscador .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--gris); pointer-events: none; }
    .buscador input {
      width: 100%; padding: 14px 18px 14px 48px; border-radius: 999px; border: 1px solid transparent;
      background: #ffffff12; color: var(--texto); font-size: 15px; font-family: inherit;
      transition: background-color .15s, border-color .15s;
    }
    .buscador input::placeholder { color: var(--gris); }
    .buscador input:hover { background: #ffffff1a; }
    .buscador input:focus { outline: none; border-color: #ffffffcc; background: #ffffff1a; }
    h2 { font-size: 24px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 16px; text-wrap: balance; }
    .aviso { color: var(--gris); padding: 20px 0; line-height: 1.6; }

    /* Cajita de sugerencias que sale debajo del buscador */
    .sugerencias { position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 5;
                   background: #232326f2; backdrop-filter: blur(16px); border: 1px solid var(--borde);
                   border-radius: 12px; padding: 6px; box-shadow: 0 16px 40px #000c; max-height: 60vh; overflow-y: auto; }
    .sugerencias[hidden] { display: none; }
    .sugerencias h4 { color: var(--gris); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; padding: 10px 10px 4px; }
    .sug { display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; min-width: 0; }
    .sug:hover { background: #ffffff12; }
    .sug img { width: 42px; height: 42px; border-radius: 6px; flex: none; background: var(--tarjeta); }
    .sug .lupa { width: 42px; display: grid; place-items: center; color: var(--gris); flex: none; }
    .sug div { min-width: 0; }

    /* ----- Lista de canciones ----- */
    .cancion {
      display: grid; grid-template-columns: 28px 48px 1fr auto; gap: 14px;
      align-items: center; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    }
    .cancion:hover { background: #ffffff0d; }
    .cancion img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--tarjeta); box-shadow: 0 4px 12px #0006; }
    .cancion .num { color: var(--gris); text-align: center; font-size: 15px; font-variant-numeric: tabular-nums; }
    .titulo { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .canal { color: var(--gris); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cancion.sonando .titulo, .cancion.sonando .num { color: var(--verde); }
    .corazon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: none; border: none; cursor: pointer; color: var(--gris); }
    .corazon:hover { color: var(--texto); }
    .corazon.lleno { color: var(--verde); }
    .corazon .ic { width: 22px; height: 22px; }

    /* Barras animadas que salen en la canción que suena */
    .ecualizador { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
    .ecualizador i { width: 3px; background: var(--verde); border-radius: 1px; animation: barra 0.9s ease-in-out infinite; }
    .ecualizador i:nth-child(2) { animation-delay: -.3s; } .ecualizador i:nth-child(3) { animation-delay: -.6s; }
    @keyframes barra { 0%, 100% { height: 4px; } 50% { height: 14px; } }

    /* ----- Biblioteca: carpetas ----- */
    .carpetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .carpeta { background: #ffffff08; border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px; cursor: pointer; min-width: 0; }
    .carpeta:hover { background: #ffffff12; }
    .tapa {
      width: 100%; aspect-ratio: 1; border-radius: 8px; margin-bottom: 12px; object-fit: cover;
      background: linear-gradient(135deg, #2ee86f, #0f5f2c); display: grid; place-items: center; color: #fff;
      box-shadow: 0 8px 24px #0008;
    }
    .tapa .ic { width: 44px; height: 44px; }
    .nuevaCarpeta { display: flex; gap: 8px; margin-bottom: 20px; max-width: 520px; }
    .nuevaCarpeta input, .bienvenida input {
      flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px; border: 1px solid var(--borde);
      background: #ffffff12; color: var(--texto); font-family: inherit; font-size: 14px;
    }
    .nuevaCarpeta input:focus, .bienvenida input:focus { outline: none; border-color: #ffffffaa; }

    /* Cabecera de una carpeta (portada grande + nombre) */
    .cabCarpeta { display: flex; gap: 20px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; }
    .cabCarpeta .tapa { width: 150px; margin: 0; flex: none; }
    .cabCarpeta small { color: var(--gris); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; }
    .cabCarpeta h3 { font-size: 32px; font-weight: 800; letter-spacing: -.8px; line-height: 1.1; margin: 4px 0 6px; text-wrap: balance; }
    .acciones { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .botonPlayGrande {
      display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--verde); color: #000; box-shadow: 0 8px 24px #1ed76055;
    }
    .botonPlayGrande:hover { background: #3be477; transform: scale(1.05); }
    .botonPlayGrande .ic { width: 26px; height: 26px; }
    .acciones .iconoBoton .ic { width: 24px; height: 24px; }
    .acciones .borrar.seguro { color: #ff5c5c; width: auto; padding: 0 12px; border-radius: 999px; font-weight: 700; gap: 6px; display: inline-flex; }

    /* ----- Hoja "Guardar en carpeta" (sale desde abajo) ----- */
    .fondoHoja { position: fixed; inset: 0; background: #000b; backdrop-filter: blur(4px); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    .fondoHoja[hidden] { display: none; }
    @keyframes subir { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .hoja {
      background: #1d1d20; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; border: 1px solid var(--borde);
      padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 80vh; overflow-y: auto; animation: subir .22s ease;
    }
    .hoja .agarre { width: 40px; height: 4px; border-radius: 2px; background: #ffffff33; margin: 0 auto 16px; }
    .hoja h3 { font-size: 18px; font-weight: 800; }
    .hoja .canal { margin-bottom: 14px; }
    .opcionCarpeta {
      display: flex; gap: 12px; align-items: center; width: 100%; padding: 10px; text-align: left;
      background: none; border: none; color: var(--texto); font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 8px;
    }
    .opcionCarpeta:hover { background: #ffffff0f; }
    .opcionCarpeta .mini { width: 40px; height: 40px; border-radius: 6px; flex: none; object-fit: cover;
                           background: linear-gradient(135deg, #2ee86f, #0f5f2c); display: grid; place-items: center; color: #fff; }
    .opcionCarpeta .mini .ic { width: 18px; height: 18px; }
    .opcionCarpeta .nombre { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .opcionCarpeta .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--gris2); display: grid; place-items: center; flex: none; }
    .opcionCarpeta .check.si { background: var(--verde); border-color: var(--verde); color: #000; }
    .opcionCarpeta .check .ic { width: 14px; height: 14px; }
    .hoja .nuevaCarpeta { margin: 14px 0 12px; }
    .hoja .boton.gris { width: 100%; justify-content: center; }

    /* Aviso "Ábrela en Brave" (solo sale si NO estás en Brave) */
    .avisoBrave { background: linear-gradient(135deg, #fb542b, #e0337a); color: #fff; border-radius: var(--radio); padding: 14px 16px; margin-bottom: 20px;
                  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; line-height: 1.4; box-shadow: 0 8px 24px #fb542b33; }
    .avisoBrave[hidden] { display: none; }
    .avisoBrave p { flex: 1 1 220px; }
    .avisoBrave a { background: #fff; color: #000; font-weight: 700; text-decoration: none; padding: 10px 18px; border-radius: 999px; white-space: nowrap; }
    .avisoBrave button { background: none; border: none; color: #fff; text-decoration: underline; cursor: pointer; font-size: 12px; }

    /* Tarjeta de bienvenida (para pegar la clave la primera vez) */
    .bienvenida { background: #ffffff0a; border: 1px solid var(--borde); border-radius: var(--radio); padding: 22px; max-width: 540px; line-height: 1.6; }
    .bienvenida h3 { margin-bottom: 8px; font-size: 18px; }
    .bienvenida ol { margin: 8px 0 14px 20px; color: var(--gris); }
    .bienvenida a { color: var(--verde); }
    .bienvenida .fila { display: flex; gap: 8px; }

    /* ----- Barra del reproductor (abajo) ----- */
    footer {
      grid-column: 1 / 3; background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio);
      display: grid; grid-template-columns: 1fr minmax(0, 1.4fr) 1fr; align-items: center; padding: 12px 16px; gap: 16px;
      position: relative;
    }
    .info { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .info img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--tarjeta); box-shadow: 0 6px 16px #0008; flex: none; }
    .info > div { min-width: 0; }
    .controles { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
    .controles .botones { display: flex; gap: 18px; align-items: center; }
    .controles .iconoBoton { color: #d4d4d8; }
    .controles .iconoBoton:hover { color: #fff; }
    .controles .iconoBoton .ic { width: 22px; height: 22px; }
    #btnPlay {
      display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
      background: #fff; color: #000; box-shadow: 0 4px 14px #0008, inset 0 -2px 0 #0000001a;
    }
    #btnPlay:hover { transform: scale(1.06); }
    #btnPlay:active { transform: scale(.9); }
    #btnPlay .ic { width: 22px; height: 22px; }
    .progreso { display: flex; gap: 10px; align-items: center; width: 100%; max-width: 560px; font-size: 11px; color: var(--gris); font-variant-numeric: tabular-nums; }
    .progreso span { width: 36px; text-align: center; }

    /* Barras deslizantes (progreso y volumen) hechas a mano para que se vean finas */
    input[type=range] {
      --pct: 0%;
      flex: 1; height: 16px; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; min-width: 0;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 4px; border-radius: 4px;
      background: linear-gradient(to right, #fff var(--pct), #ffffff33 var(--pct));
    }
    input[type=range]:hover::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--verde) var(--pct), #ffffff33 var(--pct)); }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: #fff;
      box-shadow: 0 2px 6px #0008; opacity: 0; transition: opacity .15s;
    }
    input[type=range]:hover::-webkit-slider-thumb, input[type=range]:active::-webkit-slider-thumb { opacity: 1; }
    input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: #ffffff33; }
    input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: #fff; }
    input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: none; border-radius: 50%; background: #fff; }
    input[type=range]:focus { outline: none; }
    .volumen { display: flex; justify-content: flex-end; align-items: center; gap: 8px; color: var(--gris); }
    .volumen input { max-width: 120px; }

    /* ===== MÓVIL ===== */
    @media (max-width: 700px) {
      body {
        grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; gap: 0; padding: 0;
        padding-top: env(safe-area-inset-top, 0px);
      }
      aside { flex-direction: row; flex-wrap: wrap; padding: 10px 16px; align-items: center; border-radius: 0; border: none; border-bottom: 1px solid var(--borde); gap: 6px; }
      .marca { display: none; }
      .menu { padding: 8px 14px; font-size: 14px; border-radius: 999px; background: var(--tarjeta); gap: 8px; }
      .menu.activo { background: var(--verde); color: #000; }
      .menu.activo::before { display: none; }
      .menu .ic { width: 18px; height: 18px; }
      .linkClave { margin-left: auto; }
      .sonandoAhora.visible { flex-basis: 100%; order: 3; margin: 8px 0 2px; background: none; border: none; padding: 0; }
      .sonandoAhora p { display: none; }
      main { padding: 16px; border-radius: 0; border: none; }
      h2 { font-size: 21px; }
      .cancion { grid-template-columns: 22px 44px 1fr auto; gap: 12px; padding: 6px 4px; }
      .cancion img { width: 44px; height: 44px; }
      .cabCarpeta .tapa { width: 110px; }
      .cabCarpeta h3 { font-size: 24px; }
      /* El reproductor de abajo pasa a ser una tarjeta tipo "mini reproductor" */
      footer {
        grid-column: 1; grid-template-columns: 1fr; gap: 6px; margin: 0 8px 8px;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        background: #1d1d20; box-shadow: 0 -8px 24px #0008;
      }
      .info img { width: 48px; height: 48px; }
      .volumen { display: none; }
      .controles .botones { gap: 28px; }
    }
  </style>
</head>
<body>

  <!-- ===== ICONOS: los dibujamos una vez aquí y los usamos con <use href="#..."> ===== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.98-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></symbol>

  <!-- Script oficial de YouTube: nos da el reproductor -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Pequeña ayuda para escribir iconos: icono("play") → <svg ...><use href="#i-play"></svg>
    function icono(nombre) { return `<svg class="ic"><use href="#i-${nombre}"/></svg>`; }

    // =====================================================================
    // 1) DATOS: lo que la app "recuerda"
    // =====================================================================
    // localStorage = una pequeña libreta del navegador que no se borra al cerrar.
    function leer(nombre, porDefecto) {
      try { return JSON.parse(localStorage.getItem(nombre)) ?? porDefecto; }
      catch { return porDefecto; }
    }
    function guardar(nombre, valor) {
      try { localStorage.setItem(nombre, JSON.stringify(valor)); } catch {}
    }

    // Carpetas: cada una tiene un nombre y su lista de canciones.
    // La primera vez, tus favoritos de antes pasan a la carpeta "Favoritos".
    let carpetas = leer("carpetas", null) ||
      [{ id: "fav", nombre: "Favoritos", canciones: leer("favoritos", []) }];
    let cola = [];                           // canciones que se están mostrando
    let posicion = -1;                       // cuál de la cola está sonando
    let reproductor = null;                  // el reproductor que está sonando ahora
    let jugadores = [];                      // los tres reproductores de YouTube
    let cargado = [null, null, null];        // qué canción tiene cargada cada uno
    let activo = 0;                          // cuál de los tres suena (0, 1 o 2)
    let volumen = 80;

    // =====================================================================
    // 2) LA CLAVE DE YOUTUBE (para poder buscar)
    // =====================================================================
    // Muestra una tarjeta para pegar la clave (solo hace falta una vez)
    function mostrarBienvenida() {
      cambiarVista("buscar", false);
      document.getElementById("tituloLista").textContent = "¡Hola! 👋";
      document.getElementById("lista").innerHTML = `
        <div class="bienvenida">
          <h3>Un paso antes de buscar</h3>
          Para buscar canciones necesitas una clave gratis de YouTube:
          <ol>
            <li>Abre <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank">esta página</a> y pulsa <b>Habilitar</b>.</li>
            <li>Ve a <b>Credenciales → Crear credenciales → Clave de API</b>.</li>
            <li>Cópiala y pégala aquí abajo.</li>
          </ol>
          <div class="fila">
            <input id="campoClave" placeholder="Pega tu clave aquí">
            <button class="boton" id="guardarClave">Guardar</button>
          </div>
          <p class="aviso" style="padding:8px 0 0">Mientras tanto, puedes pegar un enlace de YouTube en el buscador.</p>
        </div>`;
      document.getElementById("campoClave").value = leer("claveYT", "");
      document.getElementById("guardarClave").onclick = () => {
        guardar("claveYT", document.getElementById("campoClave").value.trim());
        mostrarInicio();
      };
    }
    document.getElementById("btnClave").onclick = mostrarBienvenida;

    // Pantalla de inicio: si no hay clave, la pedimos; si hay, invitamos a buscar
    function mostrarInicio() {
      // El botón "⚙ Clave de YouTube" solo se ve mientras no tengas clave
      document.getElementById("btnClave").hidden = !!leer("claveYT", "");
      if (!leer("claveYT", "")) return mostrarBienvenida();
      if (ultimaLista.canciones.length) return pintarLista(ultimaLista.titulo, ultimaLista.canciones);
      document.getElementById("tituloLista").textContent = "Buscar";
      document.getElementById("lista").innerHTML = '<p class="aviso">Escribe una canción, un artista o un trozo de la letra. 🎧</p>';
    }

    // =====================================================================
    // 3) BUSCAR canciones en YouTube
    // =====================================================================
    // Saca el ID de un enlace como https://youtu.be/abc o ...watch?v=abc
    function idDeEnlace(texto) {
      const m = texto.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
      return m ? m[1] : null;
    }

    // tocarPrimera = true: cuando eliges una canción de las sugerencias, suena directo
    async function buscar(texto, tocarPrimera = false) {
      const lista = document.getElementById("lista");

      // Si pegaste un enlace, lo reproducimos directamente (no hace falta clave)
      const id = idDeEnlace(texto);
      if (id) {
        cola = [{ id, titulo: "Vídeo de YouTube", canal: "", img: `https://i.ytimg.com/vi/${id}/mqdefault.jpg` }];
        ultimaLista = { titulo: "Enlace", canciones: cola };
        pintarLista("Enlace", cola);
        tocar(0);
        return;
      }

      const clave = leer("claveYT", "");
      if (!clave) return mostrarBienvenida();

      document.getElementById("tituloLista").textContent = "Buscando…";
      lista.innerHTML = "";
      // fetch = "ve a esta dirección de internet y tráeme la respuesta"
      const url = "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video" +
                  "&videoCategoryId=10&maxResults=20&q=" + encodeURIComponent(texto) + "&key=" + clave;
      try {
        const respuesta = await fetch(url);
        const datos = await respuesta.json();
        if (datos.error) throw new Error(datos.error.message);
        // Convertimos la respuesta de YouTube en nuestras "canciones"
        cola = datos.items.map(v => ({
          id: v.id.videoId,
          titulo: decodificar(v.snippet.title),
          canal: decodificar(v.snippet.channelTitle),
          img: v.snippet.thumbnails.medium.url
        }));
        ultimaLista = { titulo: 'Resultados para "' + texto + '"', canciones: cola };
        pintarLista(ultimaLista.titulo, cola);
        if (tocarPrimera) tocar(0);
      } catch (e) {
        // Si falla (por ejemplo, clave mala), damos la opción de cambiarla
        document.getElementById("tituloLista").textContent = "Algo salió mal";
        lista.innerHTML = '<p class="aviso">Error al buscar: ' + e.message +
          '<br><br><button class="boton gris" id="btnCambiarClave">Cambiar clave de YouTube</button></p>';
        document.getElementById("btnCambiarClave").onclick = mostrarBienvenida;
      }
    }

    // YouTube manda textos como "Rock &amp; Roll"; esto lo deja en "Rock & Roll"
    function decodificar(t) {
      const el = document.createElement("textarea"); el.innerHTML = t; return el.value;
    }

    document.getElementById("formBuscar").onsubmit = (e) => {
      e.preventDefault();   // evita que la página se recargue
      cerrarSugerencias();
      campo.blur();         // esconde el teclado del móvil
      const texto = campo.value.trim();
      if (texto) { cambiarVista("buscar", false); buscar(texto); }
    };

    // =====================================================================
    // 3b) SUGERENCIAS mientras escribes
    // =====================================================================
    // Usamos dos fuentes GRATIS que no gastan tu clave de YouTube:
    //  - Apple Music (iTunes): conoce todos los artistas y canciones, con portada.
    //  - Las sugerencias de YouTube: entienden frases de letras de canciones.
    const campo = document.getElementById("campoBuscar");
    const cajaSug = document.getElementById("sugerencias");
    const pais = (navigator.language.split("-")[1] || "CO").toUpperCase();
    let temporizador = null;
    let ultimaPeticion = 0;

    // Esperamos 250 ms después de cada letra para no preguntar por cada tecla
    campo.addEventListener("input", () => {
      clearTimeout(temporizador);
      const texto = campo.value.trim();
      if (!texto || idDeEnlace(texto)) return cerrarSugerencias();
      temporizador = setTimeout(() => pedirSugerencias(texto), 250);
    });

    async function pedirSugerencias(texto) {
      const numero = ++ultimaPeticion;   // para ignorar respuestas viejas que lleguen tarde
      const [canciones, frases] = await Promise.all([sugerenciasItunes(texto), sugerenciasYouTube(texto)]);
      if (numero !== ultimaPeticion || campo.value.trim() !== texto) return;
      pintarSugerencias(canciones, frases);
    }

    async function sugerenciasItunes(texto) {
      try {
        const url = "https://itunes.apple.com/search?media=music&entity=song&limit=6&country=" + pais +
                    "&term=" + encodeURIComponent(texto);
        const datos = await (await fetch(url)).json();
        return datos.results.map(c => ({ titulo: c.trackName, artista: c.artistName, img: c.artworkUrl60 }));
      } catch { return []; }
    }

    // YouTube no deja leer sus sugerencias con fetch, pero sí con un truco antiguo
    // llamado JSONP: cargamos la respuesta como si fuera un <script>.
    function sugerenciasYouTube(texto) {
      return new Promise((resolver) => {
        const nombre = "sugYT" + Date.now();
        const script = document.createElement("script");
        const terminar = (lista) => { delete window[nombre]; script.remove(); resolver(lista); };
        window[nombre] = (datos) => terminar((datos[1] || []).map(x => Array.isArray(x) ? x[0] : x).slice(0, 4));
        script.onerror = () => terminar([]);
        setTimeout(() => window[nombre] && terminar([]), 3000);
        script.src = "https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&hl=es" +
                     "&q=" + encodeURIComponent(texto) + "&callback=" + nombre;
        document.head.appendChild(script);
      });
    }

    function pintarSugerencias(canciones, frases) {
      cajaSug.innerHTML = "";
      const fila = (html, alTocar) => {
        const el = document.createElement("div");
        el.className = "sug"; el.innerHTML = html;
        // mousedown (y no click) para que el buscador no se cierre antes
        el.addEventListener("mousedown", (e) => { e.preventDefault(); alTocar(); });
        cajaSug.appendChild(el);
        return el;
      };
      if (frases.length) {
        cajaSug.insertAdjacentHTML("beforeend", "<h4>Sugerencias</h4>");
        frases.forEach(f => {
          const el = fila(`<span class="lupa">${icono("buscar")}</span><div><div class="titulo"></div></div>`, () => {
            campo.value = f; cerrarSugerencias(); campo.blur(); cambiarVista("buscar", false); buscar(f);
          });
          el.querySelector(".titulo").textContent = f;
        });
      }
      if (canciones.length) {
        cajaSug.insertAdjacentHTML("beforeend", "<h4>Canciones</h4>");
        canciones.forEach(c => {
          const el = fila('<img alt=""><div><div class="titulo"></div><div class="canal"></div></div>', () => {
            const texto = c.artista + " - " + c.titulo;
            campo.value = texto; cerrarSugerencias(); campo.blur(); cambiarVista("buscar", false);
            buscar(texto, true);   // la buscamos en YouTube y suena directo
          });
          el.querySelector("img").src = c.img;
          el.querySelector(".titulo").textContent = c.titulo;
          el.querySelector(".canal").textContent = c.artista;
        });
      }
      cajaSug.hidden = !(frases.length || canciones.length);
    }

    function cerrarSugerencias() { clearTimeout(temporizador); ultimaPeticion++; cajaSug.hidden = true; }
    campo.addEventListener("blur", () => setTimeout(cerrarSugerencias, 150));
    campo.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarSugerencias(); });

    // =====================================================================
    // 4) PINTAR la lista de canciones en la pantalla
    // =====================================================================
    function guardarCarpetas() { guardar("carpetas", carpetas); }
    function estaGuardada(id) { return carpetas.some(k => k.canciones.some(c => c.id === id)); }

    // cabecera = algo que se pone encima de la lista (portada y botones de la carpeta)
    function pintarLista(titulo, canciones, cabecera = null) {
      document.getElementById("tituloLista").textContent = titulo;
      const lista = document.getElementById("lista");
      lista.innerHTML = "";
      if (cabecera) lista.appendChild(cabecera);
      if (canciones.length === 0) {
        lista.insertAdjacentHTML("beforeend", '<p class="aviso">No hay canciones aquí todavía. Toca el corazón de una canción para guardarla.</p>');
        return;
      }
      canciones.forEach((c, i) => {
        const fila = document.createElement("div");
        fila.className = "cancion";
        fila.dataset.indice = i;
        const guardada = estaGuardada(c.id);
        fila.innerHTML = `
          <span class="num">${i + 1}</span>
          <img src="${c.img}" alt="" loading="lazy">
          <div style="min-width:0"><div class="titulo"></div><div class="canal"></div></div>
          <button class="corazon ${guardada ? "lleno" : ""}" title="Guardar en carpeta">${icono(guardada ? "corazonLleno" : "corazon")}</button>`;
        // textContent (y no innerHTML) para que un título raro no rompa la página
        fila.querySelector(".titulo").textContent = c.titulo;
        fila.querySelector(".canal").textContent = c.canal;
        fila.onclick = () => { cola = canciones; tocar(i); };
        fila.querySelector(".corazon").onclick = (e) => { e.stopPropagation(); abrirHoja(c); };
        lista.appendChild(fila);
      });
      listaPintada = canciones;
      marcarSonando();
    }

    // Pone en verde (con barritas que bailan) la canción que está sonando
    let listaPintada = null;
    function marcarSonando() {
      document.querySelectorAll(".cancion").forEach(f => {
        const i = Number(f.dataset.indice);
        const suena = listaPintada === cola && i === posicion;
        f.classList.toggle("sonando", suena);
        f.querySelector(".num").innerHTML = suena ? '<span class="ecualizador"><i></i><i></i><i></i></span>' : i + 1;
      });
    }

    // Vuelve a pintar lo que estés viendo (por ejemplo, tras guardar una canción)
    let ultimaLista = { titulo: "", canciones: [] };
    function repintar() {
      if (vistaActual === "biblioteca") mostrarBiblioteca();
      else if (vistaActual.startsWith("carpeta:")) mostrarCarpeta(vistaActual.slice(8));
      else if (ultimaLista.canciones.length) pintarLista(ultimaLista.titulo, ultimaLista.canciones);
    }

    // =====================================================================
    // 5) CARPETAS (tu biblioteca)
    // =====================================================================
    function crearCarpeta(nombre) {
      nombre = nombre.trim();
      if (!nombre) return null;
      const nueva = { id: "c" + Date.now(), nombre, canciones: [] };
      carpetas.push(nueva);
      guardarCarpetas();
      return nueva;
    }

    // La "tapa" de una carpeta: la portada de su primera canción, o un dibujo
    function tapaDe(k, clase = "tapa") {
      return k.canciones.length
        ? `<img class="${clase}" src="${k.canciones[0].img}" alt="">`
        : `<div class="${clase}">${icono(k.id === "fav" ? "corazonLleno" : "nota")}</div>`;
    }
    function cuantas(n) { return n + (n === 1 ? " canción" : " canciones"); }

    function mostrarBiblioteca() {
      document.getElementById("tituloLista").textContent = "Tu biblioteca";
      const lista = document.getElementById("lista");
      lista.innerHTML = `
        <form class="nuevaCarpeta" id="formNueva">
          <input id="nombreNueva" placeholder="Nombre de la nueva carpeta" autocomplete="off">
          <button class="boton">${icono("mas")}Crear</button>
        </form>
        <div class="carpetas" id="gridCarpetas"></div>`;
      document.getElementById("formNueva").onsubmit = (e) => {
        e.preventDefault();
        if (crearCarpeta(document.getElementById("nombreNueva").value)) mostrarBiblioteca();
      };
      const grid = document.getElementById("gridCarpetas");
      carpetas.forEach(k => {
        const el = document.createElement("div");
        el.className = "carpeta";
        el.innerHTML = tapaDe(k) + '<div class="titulo"></div><div class="canal"></div>';
        el.querySelector(".titulo").textContent = k.nombre;
        el.querySelector(".canal").textContent = cuantas(k.canciones.length);
        el.onclick = () => cambiarVista("carpeta:" + k.id);
        grid.appendChild(el);
      });
    }

    function mostrarCarpeta(id) {
      const k = carpetas.find(x => x.id === id);
      if (!k) return cambiarVista("biblioteca");
      const cab = document.createElement("div");
      cab.innerHTML = `
        <div class="cabCarpeta">
          ${tapaDe(k)}
          <div style="min-width:0"><small>Carpeta</small><h3></h3><div class="canal">${cuantas(k.canciones.length)}</div></div>
        </div>
        <div class="acciones">
          <button class="botonPlayGrande" title="Reproducir todo">${icono("play")}</button>
          <button class="iconoBoton" data-a="mezclar" title="Aleatorio">${icono("aleatorio")}</button>
          <button class="iconoBoton" data-a="volver" title="Volver a la biblioteca">${icono("atras")}</button>
          ${k.id === "fav" ? "" : `<button class="iconoBoton borrar" data-a="borrar" title="Borrar carpeta">${icono("basura")}</button>`}
        </div>`;
      cab.querySelector("h3").textContent = k.nombre;
      // ▶ Reproducir: la cola pasa a ser TODA la carpeta, empezando por la primera
      cab.querySelector(".botonPlayGrande").onclick = () => {
        if (!k.canciones.length) return;
        cola = k.canciones; tocar(0);
      };
      cab.querySelector('[data-a="mezclar"]').onclick = () => {
        if (!k.canciones.length) return;
        cola = [...k.canciones].sort(() => Math.random() - 0.5);   // copia desordenada
        tocar(0);
      };
      cab.querySelector('[data-a="volver"]').onclick = () => cambiarVista("biblioteca");
      const borrar = cab.querySelector('[data-a="borrar"]');
      if (borrar) borrar.onclick = () => {
        // Primer toque avisa, segundo toque borra (sin ventanitas)
        if (borrar.classList.contains("seguro")) {
          carpetas = carpetas.filter(x => x.id !== id); guardarCarpetas(); cambiarVista("biblioteca");
        } else { borrar.classList.add("seguro"); borrar.innerHTML = icono("basura") + "¿Borrar? Toca otra vez"; }
      };
      pintarLista(k.nombre, k.canciones, cab);
      document.getElementById("tituloLista").textContent = "";
    }

    // ----- Hoja "Guardar en carpeta" -----
    let cancionHoja = null;
    function abrirHoja(c) {
      cancionHoja = c;
      document.getElementById("hojaCancion").textContent = c.titulo;
      pintarHoja();
      document.getElementById("fondoHoja").hidden = false;
    }
    function pintarHoja() {
      const caja = document.getElementById("hojaCarpetas");
      caja.innerHTML = "";
      carpetas.forEach(k => {
        const dentro = k.canciones.some(x => x.id === cancionHoja.id);
        const b = document.createElement("button");
        b.className = "opcionCarpeta";
        b.innerHTML = tapaDe(k, "mini") + `<span class="nombre"></span><span class="check ${dentro ? "si" : ""}">${dentro ? icono("check") : ""}</span>`;
        b.querySelector(".nombre").textContent = k.nombre;
        // Tocar una carpeta mete o saca la canción de ella
        b.onclick = () => {
          if (dentro) k.canciones = k.canciones.filter(x => x.id !== cancionHoja.id);
          else k.canciones.push(cancionHoja);
          guardarCarpetas(); pintarHoja();
        };
        caja.appendChild(b);
      });
    }
    document.getElementById("hojaNueva").onsubmit = (e) => {
      e.preventDefault();
      const campoNombre = document.getElementById("hojaNombre");
      const nueva = crearCarpeta(campoNombre.value);
      if (!nueva) return;
      nueva.canciones.push(cancionHoja);   // la canción entra directo en la carpeta nueva
      guardarCarpetas(); campoNombre.value = ""; pintarHoja();
    };
    function cerrarHoja() { document.getElementById("fondoHoja").hidden = true; repintar(); }
    document.getElementById("hojaListo").onclick = cerrarHoja;
    document.getElementById("fondoHoja").onclick = (e) => { if (e.target.id === "fondoHoja") cerrarHoja(); };

    let vistaActual = "buscar";
    function cambiarVista(vista, pintar = true) {
      vistaActual = vista;
      const menu = vista.startsWith("carpeta:") ? "biblioteca" : vista;
      document.querySelectorAll(".menu").forEach(b => b.classList.toggle("activo", b.dataset.vista === menu));
      if (!pintar) return;
      if (vista === "biblioteca") mostrarBiblioteca();
      else if (vista.startsWith("carpeta:")) mostrarCarpeta(vista.slice(8));
      else mostrarInicio();
    }
    document.querySelectorAll(".menu").forEach(b => b.onclick = () => cambiarVista(b.dataset.vista));

    // =====================================================================
    // 6) EL REPRODUCTOR (YouTube IFrame API) con PRECARGA
    // =====================================================================
    // Truco tipo Spotify: tenemos TRES reproductores.
    //  - Uno suena.
    //  - Otro tiene cargada la canción SIGUIENTE (en silencio y en pausa).
    //  - Otro tiene cargada la canción ANTERIOR.
    // Al pulsar ⏭ o ⏮ solo cambiamos de reproductor: ¡suena al instante!
    function onYouTubeIframeAPIReady() {
      [0, 1, 2].forEach(n => {
        jugadores[n] = new YT.Player("reproductorYT" + n, {
          width: "100%", height: "100%",
          // controls: 0 quita los botones de YouTube (usamos los nuestros)
          playerVars: { playsinline: 1, controls: 0, rel: 0, fs: 0, iv_load_policy: 3, disablekb: 1 },
          events: {
            onReady: () => {
              jugadores[n].setVolume(volumen);
              jugadores[n].getIframe().classList.toggle("dormido", n !== activo);
            },
            onStateChange: (e) => alCambiarEstado(n, e.data)
          }
        });
      });
      reproductor = jugadores[activo];
    }
    const todosListos = () => jugadores.length === 3 && jugadores.every(j => j?.loadVideoById);

    function alCambiarEstado(n, estado) {
      const E = YT.PlayerState;
      if (n === activo) {
        // El que suena: si termina, siguiente; si empieza a sonar, precargamos vecinas
        if (estado === E.ENDED) siguiente();
        if (estado === E.PLAYING) { precargarVecinas(); silencio.play().catch(() => {}); }
        if (estado === E.PAUSED) silencio.pause();
        if ("mediaSession" in navigator && (estado === E.PLAYING || estado === E.PAUSED))
          navigator.mediaSession.playbackState = estado === E.PLAYING ? "playing" : "paused";
        ponerIconoPlay(estado === E.PLAYING);
      } else if (estado === E.PLAYING) {
        // Uno de reserva: en cuanto arranca, lo pausamos al principio (ya está cargado)
        jugadores[n].pauseVideo();
        jugadores[n].seekTo(0, true);
      }
    }

    function ponerIconoPlay(sonando) {
      const btn = document.getElementById("btnPlay");
      const nuevo = sonando ? "pausa" : "play";
      if (btn.dataset.icono === nuevo) return;
      btn.dataset.icono = nuevo;
      btn.innerHTML = icono(nuevo);
      // Pequeño "latido" cuando cambia entre play y pausa
      btn.classList.remove("latido"); void btn.offsetWidth; btn.classList.add("latido");
    }

    // Deja la anterior y la siguiente cargadas en los reproductores de reserva
    function precargarVecinas() {
      if (!todosListos()) return;
      const queremos = [cola[posicion + 1]?.id, cola[posicion - 1]?.id].filter(Boolean);
      queremos.forEach(id => {
        if (cargado.some((x, n) => x === id && n !== activo)) return;   // ya está cargada
        // Buscamos un reproductor libre (que no suene y que no tenga otra que queremos)
        const libre = [0, 1, 2].find(n => n !== activo && !queremos.includes(cargado[n]));
        if (libre === undefined) return;
        cargado[libre] = id;
        jugadores[libre].mute();
        jugadores[libre].loadVideoById(id);
      });
    }

    function cambiarA(n) {
      const viejo = jugadores[activo];
      viejo.pauseVideo();                 // no la paramos del todo: así "anterior" es instantáneo
      viejo.mute();
      activo = n;
      reproductor = jugadores[n];
      jugadores.forEach((j, k) => j.getIframe().classList.toggle("dormido", k !== activo));
    }

    function tocar(i) {
      if (!cola[i]) return;
      posicion = i;
      const c = cola[i];
      if (todosListos()) {
        const listo = cargado.findIndex((id, n) => id === c.id && n !== activo);
        if (listo >= 0) {
          // ¡Ya estaba cargada! Cambiamos a ese reproductor y suena al instante
          cambiarA(listo);
          reproductor.seekTo(0, true);
          reproductor.unMute(); reproductor.setVolume(volumen);
          reproductor.playVideo();
          // Plan B: si el navegador no la deja sonar, la cargamos de la forma normal
          const este = reproductor;
          setTimeout(() => {
            const s = este.getPlayerState();
            if (este === reproductor && posicion === i && s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.PAUSED)
              este.loadVideoById(c.id);
          }, 2500);
        } else {
          cargado[activo] = c.id;
          reproductor.unMute(); reproductor.setVolume(volumen);
          reproductor.loadVideoById(c.id);
        }
      }
      document.getElementById("infoImg").src = c.img;
      document.getElementById("infoTitulo").textContent = c.titulo;
      document.getElementById("infoCanal").textContent = c.canal;
      document.title = c.titulo + " · Mi Música";
      document.getElementById("sonandoAhora").classList.add("visible");
      actualizarNotificacion(c);
      // Portada en grande (hqdefault es la imagen más grande)
      document.getElementById("portada").src = `https://i.ytimg.com/vi/${c.id}/hqdefault.jpg`;
      // Dejamos la barra a cero para que no se vea el tiempo de la canción anterior
      ponerProgreso(0, 0);
      marcarSonando();
    }

    // =====================================================================
    // 7) CONTROLES EN LA NOTIFICACIÓN DEL MÓVIL (⏮ ⏯ ⏭)
    // =====================================================================
    // "Media Session" es la forma de decirle al móvil qué suena y qué hacer
    // con los botones de la notificación. Pero el móvil solo nos hace caso si
    // NUESTRA página está sonando (no solo el vídeo de YouTube de dentro).
    // Truco: reproducimos un audio de silencio en bucle mientras suena la música.
    const silencio = new Audio(crearSilencio());
    silencio.loop = true;

    // Crea 1 segundo de silencio como archivo de audio WAV, sin descargar nada
    function crearSilencio() {
      const muestras = 8000, datos = new DataView(new ArrayBuffer(44 + muestras * 2));
      const texto = (pos, t) => [...t].forEach((l, i) => datos.setUint8(pos + i, l.charCodeAt(0)));
      texto(0, "RIFF"); datos.setUint32(4, 36 + muestras * 2, true); texto(8, "WAVE");
      texto(12, "fmt "); datos.setUint32(16, 16, true); datos.setUint16(20, 1, true); datos.setUint16(22, 1, true);
      datos.setUint32(24, 8000, true); datos.setUint32(28, 16000, true); datos.setUint16(32, 2, true); datos.setUint16(34, 16, true);
      texto(36, "data"); datos.setUint32(40, muestras * 2, true);
      return URL.createObjectURL(new Blob([datos], { type: "audio/wav" }));
    }

    function actualizarNotificacion(c) {
      if (!("mediaSession" in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: c.titulo,
        artist: c.canal,
        album: "Mi Música",
        artwork: [{ src: `https://i.ytimg.com/vi/${c.id}/hqdefault.jpg`, sizes: "480x360", type: "image/jpeg" }]
      });
    }

    if ("mediaSession" in navigator) {
      const accion = (nombre, hacer) => { try { navigator.mediaSession.setActionHandler(nombre, hacer); } catch {} };
      accion("play", () => reproductor?.playVideo());
      accion("pause", () => reproductor?.pauseVideo());
      accion("nexttrack", () => siguiente());
      accion("previoustrack", () => anterior());
    }

    function siguiente() { if (posicion < cola.length - 1) tocar(posicion + 1); }
    // Como en Spotify: si la canción ya lleva más de 3 segundos, ⏮ la empieza
    // de nuevo (instantáneo). Si está empezando, va a la anterior.
    function anterior() {
      if (reproductor?.getCurrentTime && reproductor.getCurrentTime() > 3) return reproductor.seekTo(0, true);
      if (posicion > 0) tocar(posicion - 1);
    }

    document.getElementById("btnSiguiente").onclick = siguiente;
    document.getElementById("btnAnterior").onclick = anterior;
    document.getElementById("btnPlay").onclick = () => {
      if (!reproductor || posicion < 0) return;
      if (reproductor.getPlayerState() === YT.PlayerState.PLAYING) reproductor.pauseVideo();
      else reproductor.playVideo();
    };
    const barraVolumen = document.getElementById("barraVolumen");
    barraVolumen.oninput = () => {
      volumen = Number(barraVolumen.value);
      barraVolumen.style.setProperty("--pct", volumen + "%");   // pinta la parte llena
      reproductor?.setVolume(volumen);
    };
    const barra = document.getElementById("barraProgreso");
    let arrastrando = false;
    barra.addEventListener("pointerdown", () => arrastrando = true);
    barra.addEventListener("change", () => {
      arrastrando = false;
      if (reproductor?.getDuration) reproductor.seekTo(reproductor.getDuration() * barra.value / 1000, true);
    });
    barra.oninput = () => barra.style.setProperty("--pct", barra.value / 10 + "%");

    // Cada medio segundo actualizamos la barra de tiempo
    function formato(seg) { seg = Math.floor(seg || 0); return Math.floor(seg / 60) + ":" + String(seg % 60).padStart(2, "0"); }
    function ponerProgreso(actual, total) {
      document.getElementById("tiempoActual").textContent = formato(actual);
      document.getElementById("tiempoTotal").textContent = formato(total);
      if (arrastrando) return;
      const pct = total ? actual / total * 100 : 0;
      barra.value = pct * 10;
      barra.style.setProperty("--pct", pct + "%");
    }
    setInterval(() => {
      if (!reproductor?.getDuration || posicion < 0) return;
      ponerProgreso(reproductor.getCurrentTime(), reproductor.getDuration());
    }, 500);

    // ----- Ver vídeo o solo música -----
    // Por defecto: solo música (se ve la portada). Tu elección se recuerda.
    function aplicarModoVideo() {
      const ver = leer("verVideo", false);
      document.getElementById("video").classList.toggle("conVideo", ver);
      document.getElementById("btnVideo").innerHTML = ver ? icono("nota") + "Solo música" : icono("video") + "Ver vídeo";
    }
    document.getElementById("btnVideo").onclick = () => {
      guardar("verVideo", !leer("verVideo", false));
      aplicarModoVideo();
    };
    aplicarModoVideo();

    // ----- ¿Estás usando Brave? -----
    // Brave añade "navigator.brave" al navegador; los demás navegadores no lo tienen.
    async function comprobarBrave() {
      let esBrave = false;
      try { esBrave = !!(navigator.brave && await navigator.brave.isBrave()); } catch {}
      if (esBrave || leer("ocultarAvisoBrave", false)) return;

      const enlace = document.getElementById("enlaceBrave");
      const ua = navigator.userAgent;
      if (/Android/i.test(ua)) {
        // Enlace especial de Android: si Brave está instalado abre la app ahí;
        // si no, Android abre la Play Store directamente en Brave para instalarlo.
        const direccion = location.host + location.pathname;
        enlace.href = "intent://" + direccion + "#Intent;scheme=https;package=com.brave.browser;" +
          "S.browser_fallback_url=" + encodeURIComponent("https://play.google.com/store/apps/details?id=com.brave.browser") + ";end";
      } else if (/iPhone|iPad|iPod/i.test(ua)) {
        enlace.href = "https://apps.apple.com/app/brave-private-web-browser/id1052879175";
        enlace.textContent = "Instalar Brave";
      } else {
        enlace.textContent = "Descargar Brave";
      }
      document.getElementById("avisoBrave").hidden = false;
    }
    document.getElementById("cerrarAvisoBrave").onclick = () => {
      guardar("ocultarAvisoBrave", true);
      document.getElementById("avisoBrave").hidden = true;
    };
    comprobarBrave();

    // Registramos el ayudante para que se pueda instalar como app
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

    mostrarInicio();   // lo primero que se ve al abrir la app
    ponerIconoPlay(false);

    // Atajo: barra espaciadora = play/pausa (si no estás escribiendo)
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target.tagName !== "INPUT") { e.preventDefault(); document.getElementById("btnPlay").click(); }
    });
  </script>
</body>
</html>
